<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>База ответов</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1d242c; --line:#2a333d;
    --text:#e8edf2; --muted:#9aa7b4; --accent:#f97316; --accent2:#fb923c;
    --ok:#22c55e; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    width:440px; height:600px; display:flex; flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; font-size:14px;
  }
  header{
    background:linear-gradient(180deg,#11161c,#0f1216);
    border-bottom:1px solid var(--line); padding:12px 14px 10px; flex:none;
  }
  .title{display:flex; align-items:center; gap:9px}
  .title .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .title h1{font-size:15px; margin:0; font-weight:700; flex:1}
  #langSel{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:3px 5px; font-size:11px; font-weight:700; cursor:pointer; outline:none;
  }
  #langSel:focus{border-color:var(--accent)}
  .toolbar{display:flex; gap:8px; margin-top:10px; align-items:center}
  .search{flex:1; position:relative}
  .search input{
    width:100%; padding:9px 30px 9px 32px; border-radius:9px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    font-size:14px; outline:none;
  }
  .search input:focus{border-color:var(--accent)}
  .search .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px}
  .search .clr{position:absolute; right:8px; top:50%; transform:translateY(-50%); color:var(--muted); cursor:pointer; border:none; background:none; font-size:17px; padding:0 3px}
  .btn{
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    padding:9px 11px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#1a1206}
  .btn.primary:hover{background:var(--accent2)}
  .stats{color:var(--muted); font-size:12px; margin-top:8px}
  .stats b{color:var(--text)}
  main{flex:1; overflow-y:auto; padding:12px 14px 20px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:11px 12px 9px; margin-bottom:9px;
  }
  .card:hover{border-color:#39444f}
  .q{font-weight:600; font-size:13.5px; margin:0 0 8px; display:flex; gap:8px}
  .q .num{color:var(--accent); font-weight:700; flex:none}
  .a{
    background:var(--panel2); border-left:3px solid var(--ok); border-radius:7px;
    padding:8px 10px; color:#d6f5e0; font-weight:600; font-size:13.5px; white-space:pre-wrap; word-break:break-word;
  }
  .a.empty{color:var(--muted); font-weight:400; font-style:italic; border-left-color:var(--muted)}
  .actions{display:flex; gap:4px; margin-top:8px; justify-content:flex-end}
  .iconbtn{border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:12px; padding:3px 7px; border-radius:6px; font-weight:600}
  .iconbtn:hover{background:var(--panel2); color:#fff}
  .iconbtn.del:hover{color:var(--danger)}
  mark{background:var(--accent); color:#1a1206; border-radius:3px; padding:0 2px}
  .empty-state{text-align:center; color:var(--muted); padding:50px 20px}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:50; padding:14px}
  .overlay.show{display:flex}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:14px; width:100%; padding:16px}
  .modal h2{margin:0 0 12px; font-size:15px}
  label{display:block; font-size:12px; color:var(--muted); margin:10px 0 5px; font-weight:600}
  textarea{
    width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:13.5px; font-family:inherit; outline:none; resize:vertical;
  }
  textarea:focus{border-color:var(--accent)}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:14px}
  .panelbox{
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:10px 12px; margin-bottom:12px;
  }
  .panelbox h3{margin:0 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px}
  .prow{display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0}
  .prow .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .prow .pv{color:var(--accent2); font-weight:700}
  .ptotal{display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px;
    border-top:1px solid var(--line); font-weight:700}
  .ptotal .pv{color:var(--accent); font-size:16px; margin-left:auto}
  .muterow{display:flex; align-items:center; gap:9px; margin-top:10px; font-size:13px; cursor:pointer}
  .muterow input{width:15px; height:15px; accent-color:var(--accent); cursor:pointer}
  .linkbtn{border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0;text-decoration:underline}
  .linkbtn:hover{color:var(--danger)}
  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(16px);
    background:var(--ok); color:#06210f; padding:9px 16px; border-radius:9px; font-weight:600; font-size:13px;
    opacity:0; transition:.22s; z-index:100; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="title">
    <span class="dot"></span>
    <h1>Žinių žygis — <span id="appTitle"></span></h1>
    <select id="langSel" title="Language">
      <option value="ru">RU</option>
      <option value="en">EN</option>
      <option value="lt">LT</option>
    </select>
  </div>
  <div class="toolbar">
    <div class="search">
      <span class="ic">🔍</span>
      <input id="search" type="text" placeholder="" autocomplete="off">
      <button class="clr" id="clearSearch"  style="display:none">×</button>
    </div>
    <button class="btn primary" id="addBtn">＋</button>
    <button class="btn" id="saveFileBtn" >💾</button>
    <button class="btn" id="importBtn" >⬆</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <div class="panelbox">
    <h3 id="ptsTitle"></h3>
    <div id="ptsList"></div>
    <div class="ptotal"><span id="ptsTotalLabel"></span><span class="pv" id="ptsTotal">0</span></div>
    <label class="muterow"><input type="checkbox" id="muteChk"><span id="muteLabel"></span></label>
    <div style="margin-top:8px"><button class="linkbtn" id="ptsReset"></button></div>
  </div>
  <div id="list"></div>
  <div class="empty-state" id="emptyState" style="display:none"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <input type="hidden" id="editId">
    <label for="qInput" id="qLabel"></label>
    <textarea id="qInput" rows="3" placeholder=""></textarea>
    <label for="aInput" id="aLabel"></label>
    <textarea id="aInput" rows="3" placeholder=""></textarea>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn"></button>
      <button class="btn primary" id="saveBtn"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script src="match.js"></script>
<script src="popup.js"></script>
</body>
</html>
