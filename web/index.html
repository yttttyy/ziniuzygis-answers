  {q:"Technologijos niekad nenustoja judėti į priekį ir mūsų stebinti. O vienas ambicingiausių pastarojo meto projektų, itin išpopuliarintas Marko Zuckerbergo, — „Metaverse“. Ar žinai kas tai? Socialinis tinklas Išmanioji programėlė Sukčiavimo būdas Skaitmeninis 3D pasaulis", a:"Skaitmeninis 3D pasaulis", source:"medium"},
  {q:"Ar žinai kaip elgtis? Sukčiai nuolat sugalvoja įvairiausių būdų kaip išvilioti mūsų pinigus, o per neatidumą užkibti gali kiekvienas iš mūsų. Ką reikėtų daryti supratus, kad pateikai į sukčių pinkles?", a:"Kuo greičiau informuoti banką ir policiją bei blokuoti kortelę", source:"medium"},
  {q:"Technologijos sparčiai tobulėja, tad tokia revoliucija nėra pirma. Atsakyk, kelintą industrinę revoliuciją išgyvename šiuo metu?", a:"Ketvirtą", source:"medium"},
  {q:"Pažymėk, kokius mokesčius turi mokėti darbuotojas?", a:"Gyventojų pajamų mokestĮ (GPM)\nPrivalomojo sveikatos draudimo mokestį (PSD)\nValstybinio socialinio draudimo mokestį (VSD)", source:"medium"},
  {q:"Nepamiršk, kad gali rinktis net kelis atsakymus!", a:"Mitas ar realybė Yra nemažai klaidingų įsitikinimų apie investavimą, kuriais turėtume nustoti tikėti. Ar žinai juos?\nInvestavimas — visiška loterija\nInvesticijoms reikia daug pinigų\nYra idealus metas pirkti ir parduoti\nVisas investicijas būtina nuolatos stebėti", source:"medium"},
  {q:"Kas yra verslo tikslinė auditorija?", a:"Žmonių grupė, kuri gali naudotis verslo paslauga", source:"medium"},
  {q:"Populiarumas Visur būna populiarių. O kaip investavime? Pažymėk 3 laiko patikrintas, suprantamas ir populiarias investicines priemones.", a:"Akcijos, obligacijos, investiciniai fondai", source:"medium"},
  {q:"Ką rekomenduojama įvertinti renkantis naują ar naudotą automobilį?", a:"Naudojimo kaštus per 3–5 metų laikotarpį", source:"medium"},
  {q:"Apie technologijas Skaitmeninių technologijų naudojimas kasmet sukuria 1,6 mlrd. šiltnamio efektą sukeliančių dujų. Tai tiesa ar melas ?", a:"Tiesa", source:"medium"},
  {q:"Obligacijų stabilumas Jau žinai, kas yra akcijos ir obligacijos bei kuo jos skiriasi. Turėdamas tokį žinių bagažą, pasuk galvą ir įveik naują klausimą! Ar investavus į obligacijas galima tikėtis stabilaus pajamingumo iš savo investicijos? Pajamingumas — tai investicijos arba kito tipo turto gebėjimas generuoti pajamas.", a:"Taip, jeigu investavus į obligacijas investicija išlaikoma iki obligacijų išpirkimo", source:"medium"},
  {q:"Draugas tau nori grąžinti skolą, bet neatsimeni savo banko sąskaitos? Ką tokiu atveju daryti?", a:"Pagal telefono numerį", source:"medium"},
  {q:"Kokios yra dažniausiai naudojamos sukčiavimo schemos?", a:"Apgaulingi skambučiai\nFiktyvios žinutės\nRomantinis sukčiavimas", source:"medium"},
  {q:"Kaip įsigyti? Ar žinai, koks finansavimo būdas yra tinkamiausias, norint įsigyti automobilį neturint papildomų lėšų? Atsakyk, koks finansavimo būdas yra geriausias pasirinkimas tuo atveju, jei asmuo susiduria su padidėjusiomis išlaidomis ir neturi papildomų lėšų automobilio pirkimui?", a:"Automobilio paskola: šiai paskolai nereikia pradinio įnašo, nereikalaujamas automobilio turto vertinimas ir Kasko draudimas rekomenduojamas, tačiau neprivalomas", source:"medium"},
  {q:"Įsivaizduoji, kaip būtų gerai rasti ir sustabdyti tą vieną vienintelį klimato kaitos kaltininką? Ech, kad viskas būtų taip lengva!", a:"Žmonijos veikla", source:"medium"},
  {q:"Ar tavo gyvenimo būdas draugiškai gamtai? Pasinaudok ekologinio pėdsako skaičiuokle ir sužinok, kiek planetų reikėtų, jeigu visi vartotų kaip tu.", a:"2.4", source:"medium"},
  {q:"Vieną iš tokių poveikių pasaulio ekonomikai vadiname žaliąja infliacija. Pasidomėk ir pasirink teisingą žaliosios infliacijos apibūdinimą.", a:"Kainų augimas dėl per mažos elektromobiliams ir žaliajai energijai reikalingų žaliavų pasiūlos", source:"medium"},
  {q:"Tiesa ar melas, kad žalioji infliacija yra infliacinis paklausos šokas, kuris kyla dėl perėjimo prie žaliųjų alternatyvų?", a:"Tiesa", source:"medium"},
  {q:"Tvarumas — ne raketų mokslas. Tikrai nesunkiai gali prisidėti prie tvarumo tikslų įgyvendinimo, po truptį keisdamas savo įpročius. Valant dantis — užsuk vandenį. Rinkis viešąjį transportą.", a:"Važinėti dviračiu\nVaikščioti ir vengti motorinių transporto priemonių\nRiboti nereikalingus pirkinius", source:"medium"},
  {q:"Rizika ir grąža Jei girdėjai apie investavimą, girdėjai ir apie investicinį portfelį. Tai — vertybinių popierių ir kito investicinio turto visuma, su kuria gali gauti didžiausią grąžą su mažiausia rizika. Kaip tai veikia?", a:"Išskaidai investicijas, todėl kai vienų vertė krinta, kitos ją laiko.", source:"medium"},
  {q:"Svyravimai Investavimas reikalauja kantrybės — aiškių rezultatų galime nepamatyti ne vienerius metus! Pagalvok ir atsakyk, ar verta sunerimti ir keisti savo investavimo strategiją, jei investicios vertė svyravo, tačiau ženkliai nepakito per pirmuosius metus?", a:"Ne! Investavime vieneri metai yra labai trumpas laikotarpis, tad svyravimai yra normalu, o rezultato reikėtų tikėtis tolimesnėje ateityje, po 10–20 metų", source:"medium"},
  {q:"Pasakos vaikams apie drakonus, pasakos suaugusiems — apie per naktį iš investavimo uždirbtą milijoną. Ar moki atskirti teisybę nuo pasakų?", a:"Investuoti reikia ne pagal tai, kiek nori uždirbti, o kiek gali prarasti", source:"medium"},
  {q:"Kiek žinių esi sukaupęs apie Lietuvos startuolius?", a:"„Vinted“ yra pirmasis Lietuvos startuolis vienaragis\n„Unicorns Lithuania“ yra oficiali Lietuvos startuolių asociacija", source:"medium"},
  {q:"Pasidomėk ir atsakyk, kas yra investicinis fondas?", a:"Investicinė priemonė, kurioje sukauptas daugelio investuotojų turtas, kurį valdo profesionalus valdytojas", source:"medium"},
  {q:"Tu puikiai žinai, kad popieriniais Monopolio pinigais už prekes ir paslaugas neatsiskaitysi, todėl turime dirbti ir uždirbti tikrus pinigus. Bet jei tik galėtum… Ką pirktum?", a:"Iš medvilnės", source:"medium"},
  {q:"Ar žinai, kiek medžių išsaugoma perdirbus ir naujai panaudojus vieną toną popieriaus?", a:"17 medžių", source:"medium"},
  {q:"Kuo skiriasi taupymas nuo investavimo?", a:"Didžiausias skirtumas, kad investuojant pinigai „įdarbinami“, o taupant jie tiesiog „laukia“.", source:"medium"},
  {q:"Kokių 3 pagrindinių taisyklių reikia laikytis sudarant verslo planą?", a:"Trumpai, aiškiai, įtikinamai", source:"medium"},
  {q:"Ar žinai, kodėl patogu būti įsidiegus sąskaitos likučio valdiklį mobiliojoje programėlėje?", a:"Greičiau patikrinsi savo sąskaitos likutį", source:"medium"},
  {q:"Jei galėtum ant pasaulinio žurnalo viršelio atspausdinti vieną lietuvišką atributą, kas tai būtų?", a:"10 litų", source:"medium"},
  {q:"Kas tai?", a:"Dempingas", source:"medium"},
  {q:"Ar žinai, kiek yra tvarumo tikslų? Įrašyk tikslų skaičių.", a:"17", source:"medium"},
  {q:"Infliacijos paradoksas: taupai daugiau, bet sutaupai mažiau. Kaip tam pasiruošti?", a:"Investuoti į nekilnojamą turtą ar vertybinius popierius", source:"medium"},
  {q:"Yra nemažai dalykų, kuriuos naudinga išmanyti pradedant verslą. O ar žinai…?", a:"Idėja", source:"medium"},
  {q:"Naudotojo ID tai yra unikalus kliento numeris. Ar žinai kam jis skirtas?", a:"Jungiantis prie interneto banko", source:"medium"},
  {q:"Kas yra šis gamintojas?", a:"„Volkswagen”", source:"medium"},
  {q:"Socialiniuose tinkluose seki savo draugus, nes nori žinoti, kur ir ką jie veikia?", a:"Kad planuotum finansus, numatytum ir siektum finansinių tikslų ir finansinio saugumo", source:"medium"},
  {q:"Kiek procentų per vieną dieną nukrito Semo Bankmano-Friedo turto vertė bankrutuojant jo įkurtai kriptovaliutų biržai FTX?", a:"94 proc.", source:"medium"},
  {q:"Tam, kad būtų užtikrintas asmens duomenų saugumas ir būtume tikri, kad įrenginį naudoja šią teisę turintis asmuo, „Smart-ID“ paskyra turi savo galiojimo laiką. Ar žinai, kokį?", a:"3 metus", source:"medium"},
  {q:"Ar žinai, kiek vandens sunaudojama norint pagaminti vienus marškinėlius?", a:"2700 L", source:"medium"},
  {q:"Ar tiesa, kad mokėjimo kortelės visame pasaulyje yra vienodo dydžio (formato)?", a:"Tiesa", source:"medium"},
  {q:"Kelių metų garantiją elektromobilio baterijai dažniausiai suteikia gamintojai?", a:"8 metų", source:"medium"},
  {q:"Kurios šalies IBAN ilgis (simbolių skaičius) yra didžiausias?", a:"Maltos (28)", source:"medium"},
  {q:"Kokią sumą vidutiniškai sudaro šie mokesčiai įsigyjant būstą?", a:"1–1,5 tūkst. eurų", source:"medium"},
  {q:"Kokioje Europos šalyje šis tarifas mažiausias?", a:"Liuksemburge", source:"medium"},
  {q:"Ar gali atskirti, kuris iš šių banko laiškų yra netikras?", a:"A", source:"medium"},
  {q:"Koks finansų rinkų kritimas laikomas krize?", a:"Bent 20 proc.", source:"medium"},
  {q:"Mažiau uždirbi — moki mažiau Turbūt nustebsi, kad Lietuvoje ne visi mokėtojai moka mokesčius pagal tą patį tarifą. Daugiau uždirbantieji moka daugiau, o itin mažai uždirbanys jo nemoka visai. Kaip vadinama ši mokesčių sistema?", a:"Progresiniai mokesčiai", source:"medium"},
  {q:"Kibernetinė ataka Sukčių fantazija beribė ir neretai jie griebiasi itin purvinų būdų mūsų pinigams išvilioti. Vienas jų — „ransomware“ kibernetinė ataka. Ar žinai, kas tai?", a:"Kai už pavogtus duomenis reikalaujama išpirka", source:"medium"},
  {q:"Kokie PVM tarifai yra taikomi Lietuvoje?", a:"21 proc.\n9 proc.\n5 proc.\n0 proc.", source:"medium"},
  {q:"Kuris iš išvardintų faktų NĖRA apie „Smart-ID“?", a:"Tai būdas greitai sužinoti savo asmens kodą", source:"medium"},
  {q:"Kokius mokesčius mokame? Jei vasarą teko padirbėti, turbūt pastebėjai, kad tarp atlyginimo „ant popieriaus“ ir atlyginimo „į rankas“ yra nemažas skirtumas. Tas skirtumas — tai mūsų mokami mokesčiai. Bet ar žinai, kokius mokesčius moki gaudamas atlyginimą?Kokie yra darbuotojo mokesčiai, skaičiuojami nuo atlyginimo, uždirbamo pagal darbo sutartį Lietuvoje ? Nespėliok, skaityk ir atsakyk.", a:"Gyventojų pajamų mokestis, privalomojo sveikatos draudimo įmokos, socialinio draudimo įmokos.", source:"medium"},
  {q:"Kaip aktyvus naudojimasis soc. tinklais keičia personalizuotos sukčių atakos tikimybę?", a:"Ją didina, nes suteikia vertingos informacijos apie mus", source:"medium"},
  {q:"Kriptovaliutos — jau tapo mada. Turbūt girdėjai apie skaitmenines valiutas, o gal netgi bandei investuoti į jas? Pasitikrink, kiek žinai apie šią technologiją ir atsakyk!", a:"Kriptovaliutos yra decentralizuotos ir neprižiūrimos jokių finansinių institucijų\nKriptovaliutos vertė priklauso nuo paklausos ir pasiūlos\nPraradus ar sugadinus įrenginį su kriptovaliutomis jų atkurti yra nebeįmanoma\nKriptovaliutų vienetų kiekis yra ribotas", source:"medium"},
  {q:"Jei vasaromis atostogauji Palangoje, turbūt teko girdėti apie vadinamąjį pagalvės mokestį — mokestį už kiekvieną praleistą dieną viešbutyje, svečių namuose ar kitur. Kad ir kaip neįprastai skambėtų šis pavadinimas, tai toli gražu ne keisčiausias mokesčio pavadinimas istorijoje.", a:"Langų mokestis\nBarzdos mokestis\nŽidinių mokestis\nDruskos mokestis\nKortų mokestis", source:"medium"},
  {q:"Skamba itin viliojančiai, bet ar tai tiesa, o gal sukčių pinklės?", a:"Sukčių pinklės", source:"medium"},
  {q:"Pasaulyje yra daug ir įvairių gigantų. Didžiausias žinduolis — banginis. O štai stambiausią visų laikų spekuliaciją valiuta atliko Džordžas Sorošas. O ar žinai, kas yra spekuliantas?", a:"Orientavimasis į trumpalaikį investavimą\nGreito pelno siekimas\nPrisiimama aukšta finansinė rizika", source:"medium"},
  {q:"Už ką mokam mokesčius? Vė vė, vė es dė! Valstybinis socialinis draudimas (arba VSD) — tai mokestis, kurį tau reikės mokėti, kai pradėsi dirbti. Kam reikalingas šis mokestis?", a:"Suteikiamos socialinės garantijos", source:"medium"},
  {q:"Fišingas Deja, terminas „fišingas“ niekuo susijęs su meškerėmis ir smagiu pusdieniu prie ežero. Ar žinai, kas iš tikrųjų yra fišingas?", a:"Sukčiavimas klastojant laiškus ar SMS, siekiant susirinkti duomenis", source:"medium"},
  {q:"Ką reiškia, jei prabangaus prekės ženklo produktas yra siūlomas už neįtikėtinai mažą kainą?", a:"Prekė gali būti neorginali arba ją siūlanti parduotuvė — netikra", source:"medium"},
  {q:"Verslo formos Prie įmonių pavadinimų turbūt esi pastebėjęs raideles AB, UAB, MB ir kitas. Šios raidės — tai verslo formų (veiklos pobūdžio) trumpiniai. Ar žinai, kiek iš viso jų yra? Atsakymą įrašyk skaičiumi. Atsakyti padės „Pradėk dabar: finansinis gidas paaugliams“.", a:"7", source:"medium"},
  {q:"Kaip įvardintum šį procesą?", a:"Arbitražu", source:"medium"},
  {q:"Patvirtink mokėjimą saugiai Nors „Smart-ID“ ir yra vienas saugiausių būdų patvirtinti mokėjimą, neturėtum juo pasikliauti aklai — sukčiams tai labai patinka! Ar žinai, kaip patvirtinti mokėjimą su „Smart-ID“ saugiai?Suvedant PIN kodą bet kada iššokus mokėjimo patvirtinimo pranešimui", a:"Inicijavus mokėjimą ir įsitikinus, kad kontroliniai kodai sutampa", source:"medium"},
  {q:"Kuo daugiau žodžių žinai, tuo paprasčiau bendrauti. Patikrink savo žinias!Kaip dar galime vadinti obligacijas?", a:"Skolos vertybiniai popieriais", source:"medium"},
  {q:"Pasaulyje šiuo metu yra 180 skirtingų valiutų. O ar žinai, kokia dažniausiai naudojama investuojant ir skolinantis?", a:"JAV doleris", source:"medium"},
  {q:"Individuali veikla Jei nuspręsi pradėti savarankišką darbą, turėsi pasirinkti vieną iš veiklos formų: individualią veiklą pagal pažymą arba verslo liudijimą. Tačiau kurią pasirinkti? Vienas būdas apsispręsti — tai savo potencialių pajamų įvertinimas. Kiek daugiausia pajamų per metus galima gauti vykdant veiklą su verslo liudijimu?", a:"Ne daugiau kaip 45 tūkst. eurų.", source:"medium"},
  {q:"Kuri iš šių žinučių yra netikra? Sunku pasirinkti? Nespėliok, skaityk ir atsakyk.", a:"Abi netikros", source:"medium"},
  {q:"Monopolininkai Gamtoje ežeras natūraliai gali tapti pelke, o rinkoje — natūraliai gali susidaryti monopolija. „Natūrali monopolija“ — tai terminas, kuris apibūdina patekimą į rinką srityje, kurią riboja didelės kliūtys ar išlaidos, o didžiausias ir dažnai pirmas tiekėjas turi pranašumą prieš galimus konkurentus. Kurie iš pateiktų pavyzdžių laikomi natūraliomis monopolijomis Lietuvoje? Nepamiršk, kad gali rinktis net kelis atsakymus!", a:"Geležinkeliai\nCentralizuotas vandens tiekimas", source:"medium"},
  {q:"Sukčių taikinys Į sukčių pinkles gali įkliūti bet kas, tačiau paprastai pinigų mulų ieškantys sukčiai nusitaiko į tam tikras gyventojų grupes. Kokios tai grupės?", a:"Moksleiviai ir studentai", source:"medium"},
  {q:"Padėtis rinkoje Patinka ar nepatinka, bet kartais rinkoje taip nutinka! Kaip vadinama padėtis rinkoje, kai didžioji tam tikrų prekių ar paslaugų pasiūlos dalis priklauso nedideliam gamintojų skaičiui?", a:"Oligopolija", source:"medium"},
  {q:"Saugumo trumpiniai Turbūt žinai nemažai angliškų trumpinių, tokių kaip: OMG, ASAP ar IQ. Tiesa? Kokį sukčiavimo būdą reiškia angliškas trumpinys BEC? Nespėliok, skaityk ir atsakyk.", a:"Business Email Compromise (verslo el. susirašinėjimų užvaldymas)", source:"medium"},
  {q:"Įmonės sėkmė Pelno (nuostolių) ataskaita — tai svarbus dokumentas sutekiantis nemažai informacijos apie įmonės sėkmę. Kokią informaciją ji parodo? Atsakyti padės „Pradėk dabar: finansinis gidas paaugliams“. Įmonės turtą Įmonės įsipareigojimus", a:"Įmonės finansinį rezultatą (pajamas, sąnaudas, pelną)", source:"medium"},
  {q:"Kam atskleisi? Kai kas nors labai gražiai prašo, tau sunku pasakyti „ne“? Kokios institucijos turi teisę prašyti atskleisti tavo internetinio banko prisijungimo duomenis?", a:"Nei viena", source:"medium"},
  {q:"Verslo terminai Besidomėdamas verslu bei investavimu anksčiau ar vėliau susidursi su terminu „FinTech“. Ar žinai jo reikšmę? Kas yra „FinTech“ ?", a:"Finansinės technologijos", source:"medium"},
  {q:"Darbas nuotoliu Atėjus karantinui, nemažai įmonių leido savo darbuotojams dirbti iš namų. Ir nors darbas dėvint pižamą ir įsispyrus į mėgstamiausias šlepetes gali atrodyti išties viliojančiai, nuotolinis darbas sukėlė reiškinį, įvardijamą „didžiojo pasitraukimo“ (angl. great resignation) banga. Ką reiškia šis terminas? Daugiau informacijos", a:"Išėjimas iš darbo", source:"medium"},
  {q:"Smogo pasekmės Kasmet nuo ligų, kurias sukelia oro užterštumas, pasaulyje miršta X žmonių. Pasirink kas yra X.", a:"Daugiau nei 6 milijonai", source:"medium"},
  {q:"Kas slepiasi po pavadinimu? Verslo pasaulyje dažnai išgirstame terminų, kurių reikšmę sunku suprasti vien iš pavadinimo. Vienas jų — tai „barteris“. Ką reiškia šis terminas?", a:"Prekyba, paremta natūriniais mainais", source:"medium"},
  {q:"Šiek tiek apie studijas Įsivaizduok — keletą metų svajoji studijuoti, tačiau vis nepavyksta įstoti į valstybės finansuojamą vietą. Taip nutikus tau gali padėti valstybės remiama paskola studentams. Kaip tai vyksta? Ar žinai, kam turi pateikti prašymą paskolai gauti? Studijų paskolą gauna ne visi, tačiau jei laiku pateikei prašymą Valstybiniam studijų fondui ir jau patekai į studijų paskolos gavėjų sąrašą, tau reikia kreiptis į banką ir pasirašyti sutartį!", a:"Valstybiniam studijų fondui", source:"medium"},
  {q:"Netikėti turtai ar netikėtos skolos? Įsivaizduok filmo vertą situaciją — gauni laišką, kad iš tolimo giminaičio paveldėjai nemažą sumą pinigų. Smagumėlis! Deja, šis netikėtas praturtėjimas gali greitai apkarsti, jei su veliono turtais paveldėsi ir jo skolas. Koks dokumentas reikalingas priimant palikimą, kad nereikėtų asmeninėmis lėšomis atsakyti už velionio skolas?", a:"Turto apyrašas", source:"medium"},
  {q:"Koks žodis yra praleistas?", a:"EURIBOR", source:"medium"},
  {q:"Terminai Ekonomikos nuosmukis gali atsirasti dėl karo, pandemijos, stichinių nelaimių ar socialinių neramumų. Kaip vadinama ekonominė situacija, kai nemažiau nei du ketvirčius iš eilės yra fiksuojamas neigiamas bendro vidaus produkto (BVP) augimas?", a:"Recesija", source:"medium"},
  {q:"Šuolis aukštyn Infliacija vadiname kainų augimą arba kitaip — pinigų nuvertėjimą. Infliacija gali būti net trijų rūšių: hiperinfliacija, šuoliuojanti infliacija ir ___. Atsakyk, kokios infliacijos rūšies čia trūksta?", a:"šliaužianti infliacija", source:"medium"},
  {q:"Skubiai skubu Draugas parašė žinutę, kad jam skubiai reikia vos kelių eurų. Tu teleportuotis negali, bet gali tavo pinigai! Atlieki skubų vietinį pinigų pervedimą. Kaip greitai draugas gali sulaukti tavo pagalbos ir pinigų savo sąskaitoje? Ne vėliau kaip per 1 min. Ne vėliau kaip per 1 val. Ne vėliau kaip per 1 d.", a:"Ne vėliau kaip per 1 val.", source:"medium"},
  {q:"Per kiek dienų galima atblokuoti banko kortelę, ją užblokavus?", a:"Per 10 dienų", source:"medium"},
  {q:"Skubus, paprastas ar momentinis? Dainos žodžiai sako „gimiau nei per anksti, nei per vėlai, gimiau pačiu laiku“. O kaip yra su pavedimais? Ar visi atliekami laiku? Kaip vadinasi mokėjimas į kitą banką ar mokėjimo paslaugų teikėjo įstaigą Lietuvoje, kai jis atliekamas tą pačią darbo dieną iki 16 val., o pervedus vėliau — kitą darbo dieną.", a:"Paprastas pervedimas eurais", source:"medium"},
  {q:"Su litu atsisveikinome ne taip ir seniai. Gal pameni kada?", a:"2015", source:"medium"},
  {q:"Eurų banknotai yra septynių skirtingų nominalų: 5, 10, 20, 50, 100, 200 ir 500 eurų. Bet ar pastebėjai, jog visus euro banknotus vienija bendra piešinių tematika?", a:"Tiltai", source:"medium"},
  {q:"Pensijų pakopos ir lengvatos III pensijų kaupimo pakopa suteikia galimybę senatvei kaupti papildomas lėšas savo pasirinktu dažnumu ir sumomis. Patikrink žinias apie šią pensijų pakopą! Ar tiesa, kad sudarius III pensijų kaupimo pakopos sutartį galėsiu pasinaudoti gyventojų pajamų mokesčio lengvata? Sužinok apie pensijų kaupimo pakopas Lietuvoje ir atsakyk.", a:"Tiesa", source:"medium"},
  {q:"Tavo ateitis Įsivaizduok tokią situaciją. Tau 18 metų, ką tik gavai savo pirmajį darbą ir turi nuspręsti, dėl pensijos kaupimo. Naudodamasis III pakopos pensijų kaupimo skaičiuokle paskaičiuok, kokią mėnesinę įmoką ir pensijų fondą turi pasirinkti, kad sukauptum 50 361 EUR sumą. Kokia mėnesinė įmoka reikalinga, siekiant sukaupti tokią sumą?", a:"16", source:"medium"},
  {q:"Kas tas likvidumas? Ekonomikoje likvidumas reiškia ne galimybę pavirsti skysčiu, o galimybę turtą greitai iškeisti į grynuosius. Ar atskirtum, kuris turtas yra likvidesnis? Ar tiesa, kad nekilnojamasis turtas (pvz.: žemės sklypas) yra likvidesnis už taupomąjį indėlį? Tiesa Netiesa", a:"Netiesa", source:"medium"},
  {q:"Tai kam gi galioja? Kelionių draudimas — puikus būdas apsisaugoti nuo netikėtumų kelionėse! Pažiūrėkim, ką apie jį žinai. Ar žinai, kam negalioja Kelionių draudimas? Jei mėgsti keliones — turi ką apdrausti! Kelionių draudimas padės tau įvykus nelaimingam atsitikimui, tačiau ir čia yra papildomų sąlygų.", a:"Tavo augintinio patirtoms traumoms", source:"medium"},
  {q:"Taupytojų tipai Norėtųsi, kad būtų kitaip, bet, dažniausiai, norint kažką nusipirkti, pirmiau rekia sutaupyti. Ar žinojai, kad yra skirtingų taupytojų? Kaip vadinami žmonės, kurie taupo sąmoningai ir turi planą, kaip pasiekti savo finansinius tikslus?", a:"Racionalūs taupytojai", source:"medium"},

  {q:"Patarimas Kas vaikystėje nėra skolinęsis iš draugo ledams. Nieko tokio? Bet jei iš visų draugų pasiskolintum ledams, susidarytų ne maža sumelė. Atiduoti sunku, o naudos, ne tiek ir daug. Kaip tuomet elgtis? Ekonomistai pataria nesiskolinti pinigų tam, kas nėra būtina ir prasminga. Kaip vadinamas šis patarimas?", a:"Atsakingas skolinimasis", source:"medium"},

  {q:"Vertėjas Gyvenime turbūt teko naudotis užsienio kalbos žodynu? Ar žinai, kad ir investavimas turi savą žodynėlį. Atspėk paslėptą mintį ir pasirink tinkamą frazę. Didelė grąža yra neatsiejama nuo …", a:"Didelės rizikos", source:"medium"},
  {q:"Paskirtis. Studijos įdomios ne tik dėl paskaitų, bet ir naujų patirčių. A žinai, kam gali būti skirta paskola už studijas?", a:"Įmokoms už studijas, dalinėms studijoms užsienyje, gyvenimo išlaidoms", source:"medium"},
  {q:"Kaip du vandens lašai Kredito ir debeto kortelės išoriškai — labai panašios. Tačiau yra viena esminė funkcija, kuria kredito kortelė skiriasi nuo debeto kortelės. Ar žinai, kokia ta funkcija?", a:"Tik kredito kortelė gali „paskolinti“ pinigų", source:"medium"},
  {q:"Koks tas šūkis? Šūkis gali padėti vartotojui atskleisti norimą žinutę. Nepamiršk to, kai kursi savo verslą! Koks yra šių metų „Mokonomikos“ šūkis?", a:"Skambutis į ateitį!", source:"medium"},
  {q:"Bendrystė Bendrystė leidžia tapti didelių tikslų dalimi — „Mokonomika“, kartu su pasaulinėmis organizacijomis, prisideda prie darnaus vystymosi tikslų įgyvendinimo. Ar žinai, kokios yra tos minėtosios pasaulinės organizacijos? Pažymėk jas.", a:"UNICEF\nUNESCO\nJungtinių Tautų Organizacija", source:"medium"},
  {q:"Ilgalaikė strategija Mūsų ateitis yra neatsiejama nuo neigiamo poveikio aplinkai mažinimo. Tiesa ar melas, kad ES šalys yra įsipareigojusios iki 2060 m. sumažinti išmetamų CO2 ir kitų šiltnamio efektą sukeliančių dujų kiekį bei neutralizuoti savo poveikį klimatui? Skaityk ir atsakyk.", a:"Melas", source:"medium"},

  {q:"Noriu automobilio! Užsienyje parduodamų automobilių pasiūlymai atrodo šauniai? Metas sužinoti daugiau! Kaip manai, ar galima užsienyje parduodamą automobilį įsigyti lizingu? Grįžtamasis lizingas — lizingo bendrovė įsigyja klientui priklausantį turtą ir perduoda jį pagal lizingo sutartį to paties kliento dispozicijai.", a:"Taip, bet pirmiausia automobilį reikia nusipirkti savo lėšomis ir užregistruoti savo vardu, tada LR transporto priemonių registre galima kreiptis dėl grįžtamojo lizingo", source:"medium"},
  {q:"Dėl šylančio klimato Prancūzijoje nuseko upės, naudojamos atominiams reaktoriams vėsinti. Todėl Prancūzija turėjo pristabdyti jėgainių darbą, o toks sprendimas paveikė elektros kainas. Atsakyk, kaip?", a:"Elektros kainos išaugo", source:"medium"},

  {q:"Apsaugok ne tik automobilį! Kai įsigyji automobilį — būtinai turi jį apdrausti. Bet kas padeda apsidrausti kelyje? Tau padėti gali Kasko draudimas! Šis draudimas yra savanoriškas ir padės įvykus eismo įvykiui, vagystei, gaisrui ar kitiems draudžiamiesiems įvykiams. Mūsų draugas Tomas jau sudarė šio draudimo sutartį. Atsakyk, kada Tomui įsigalios šio draudimo apsauga?", a:"Pirmą draudimo sutartyje nurodytą draudimo laikotarpio dieną, sumokėjus pirmąją draudimo įmoką ar jos dalį", source:"medium"},
  {q:"Pagrindinės sąvokos Svajoji apie savo verslą ateityje? Būk pasiruošęs iš anksto — susipažink su pagrindinėmis sąvokomis!", a:"Potencialu sparčiai augti ir plėstis", source:"medium"},
  {q:"Draudimas- investavimas? Apdraudžiu savo gyvybę, vadinasi, investuoju? Pala… Ar tikrai taip gali būti?! Ar gyvybės draudimas gali būti laikomas investavimo priemone?", a:"Taip, gyvybės draudimas gali būti laikomas investavimo priemone. Periodiškai mokant nedideles draudimo įmokas, laikotarpio pabaigoje galima sukaupti pinigų sumą, kuri išmokama sutartyje nurodytam asmeniui", source:"medium"},

  {q:"Pėdsakai internete Naudodamas socialinius tinklus palieki ne tik skaitmeninį, bet ir CO2 pėdsaką. Žiūrėk vaizdo įrašą, sužinok, kiek tonų šiltnamio efektą sukeliančių dujų sukuria skaitmeninių technologijų naudojimas ir atsakyk. Kuriame iš socialinių tinklų 1 valanda sugeneruoja daugiausia CO2 ? https://youtu.be/1VlIqJ5ekU8", a:"TikTok", source:"medium"},

  {q:"Skolinkis protingai Kai tėvai liepia tvarkytis, žinoma, norisi savo namų. Bet būsto paskola — reikšmingas finansinis žingsnis. Prieš skolindamasis turėtum gerai įvertinti savo finansines galimybes. Kokią dalį visų mėnesio pajamų turėtų sudaryti įmokos už būsto paskolą ir kiti finansiniai įsipareigojimai? Nespėliok, ieškok atsakymo čia.", a:"Neviršyti 40 proc.", source:"medium"},

/* ====== STORAGE & STATE ====== */
const LS_KEY = "swedbank_qa_db_v3";
let data = [];
let query = "";

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let storageOK = true;
function load(){
  let saved = null;
  try{ saved = localStorage.getItem(LS_KEY); }
  catch(e){ storageOK = false; } // напр. file:// без доступа к localStorage
  if(saved){
    try{ data = JSON.parse(saved); if(Array.isArray(data) && data.length) return; }catch(e){}
  }
  // первый запуск (или обновление базы) — загружаем базовый набор
  data = SEED.map(x => ({...x, id: uid()}));
  // миграция: переносим вопросы, добавленные вручную в прошлой версии базы
  try{
    const old = localStorage.getItem("swedbank_qa_db_v2") || localStorage.getItem("swedbank_qa_db_v1");
    if(old){
      const arr = JSON.parse(old);
      if(Array.isArray(arr)){
        const mine = arr.filter(x => x && x.source === "mine" && x.q);
        if(mine.length) data = mine.map(x => ({...x, id: x.id || uid()})).concat(data);
      }
      localStorage.removeItem("swedbank_qa_db_v1"); localStorage.removeItem("swedbank_qa_db_v2");
    }
  }catch(e){}
  save();
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  catch(e){ storageOK = false; }
}

/* ====== RENDER ====== */
const $ = s => document.querySelector(s);
const listEl = $("#list");
const statsEl = $("#stats");
const emptyEl = $("#emptyState");

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hi(text, q){
  const e = esc(text);
  if(!q) return e;
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return e.replace(new RegExp('('+safe+')','gi'), '<mark>$1</mark>');
}
function render(){
  const q = query.trim().toLowerCase();
  let rows = data;
  if(q){
    rows = rows.filter(r => (r.q||"").toLowerCase().includes(q) || (r.a||"").toLowerCase().includes(q));
  }
  // naujausi pridėti viršuje? Palikim originalią tvarką, bet "mine" rodom viršuj jei filtras all? – paprasčiau: originalia tvarka.
  statsEl.innerHTML = `Показано <b>${rows.length}</b> из <b>${data.length}</b> вопросов` + (storageOK ? "" : ` · <span style="color:var(--accent2)">⚠ браузер не сохраняет изменения (откройте через локальный сервер)</span>`);
  if(rows.length===0){ listEl.innerHTML=""; emptyEl.style.display="block"; return; }
  emptyEl.style.display="none";
  listEl.innerHTML = rows.map((r,i)=>{
    const empty = !r.a || !r.a.trim();
    return `<div class="card">
      <div class="q"><span class="num">${i+1}.</span><span>${hi(r.q,q)}</span></div>
      <div class="a ${empty?'empty':''}">${empty?'— ответ не заполнен —':hi(r.a,q)}</div>
      <div class="meta">
        <div class="actions">
          <button class="iconbtn" data-copy="${r.id}">⧉ Копировать</button>
          <button class="iconbtn" data-edit="${r.id}">✎ Редактировать</button>
          <button class="iconbtn del" data-del="${r.id}">🗑 Удалить</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* ====== MODAL ====== */
const overlay = $("#overlay");
function openModal(item){
  $("#modalTitle").textContent = item ? "Редактировать вопрос" : "Добавить новый вопрос";
  $("#editId").value = item ? item.id : "";
  $("#qInput").value = item ? item.q : "";
  $("#aInput").value = item ? item.a : "";
  overlay.classList.add("show");
  setTimeout(()=>$("#qInput").focus(),50);
}
function closeModal(){ overlay.classList.remove("show"); }

function saveModal(){
  const id = $("#editId").value;
  const q = $("#qInput").value.trim();
  const a = $("#aInput").value.trim();
  if(!q){ toast("Введите вопрос"); $("#qInput").focus(); return; }
  if(id){
    const r = data.find(x=>x.id===id);
    if(r){ r.q=q; r.a=a; }
    toast("Обновлено ✓");
  }else{
    data.unshift({id:uid(), q, a, source:"mine"});
    toast("Добавлено ✓");
  }
  save(); render(); closeModal();
}

/* ====== TOAST ====== */
let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ====== СОХРАНЕНИЕ В ФАЙЛ ====== */
let fileHandle = null;
async function saveToFile(){
  const json = JSON.stringify(data, null, 2);
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle){
        fileHandle = await window.showSaveFilePicker({
          suggestedName: "swedbank-atsakymai.json",
          types: [{description:"JSON", accept:{"application/json":[".json"]}}]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      toast("Сохранено в файл ✓");
      return;
    }catch(e){ if(e.name==="AbortError") return; }
  }
  // запасной вариант — обычное скачивание
  const blob = new Blob([json], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "swedbank-atsakymai.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Файл скачан ✓");
}

/* ====== EVENTS ====== */
$("#search").addEventListener("input", e=>{
  query = e.target.value;
  $("#clearSearch").style.display = query ? "block" : "none";
  render();
});
$("#clearSearch").addEventListener("click", ()=>{
  query=""; $("#search").value=""; $("#clearSearch").style.display="none"; render(); $("#search").focus();
});
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){
    e.preventDefault(); $("#search").focus();
  }
  if(e.key==="Escape") closeModal();
});
listEl.addEventListener("click", e=>{
  const ed = e.target.closest("[data-edit]");
  const dl = e.target.closest("[data-del]");
  const cp = e.target.closest("[data-copy]");
  if(ed){ openModal(data.find(x=>x.id===ed.dataset.edit)); }
  if(cp){ const r=data.find(x=>x.id===cp.dataset.copy); navigator.clipboard.writeText(r.a||r.q).then(()=>toast("Скопировано ✓")); }
  if(dl){
    if(confirm("Удалить этот вопрос?")){
      data = data.filter(x=>x.id!==dl.dataset.del); save(); render(); toast("Удалено");
    }
  }
});
$("#addBtn").addEventListener("click", ()=>openModal(null));
$("#fabAdd").addEventListener("click", ()=>openModal(null));
$("#cancelBtn").addEventListener("click", closeModal);
$("#saveBtn").addEventListener("click", saveModal);
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });
$("#qInput").addEventListener("keydown", e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) saveModal(); });
$("#aInput").addEventListener("keydown", e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) saveModal(); });
$("#saveFileBtn").addEventListener("click", saveToFile);

/* ====== INIT ====== */
load();
render();
</script>
