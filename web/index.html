<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swedbank žinių žygis — База ответов</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1d242c; --line:#2a333d;
    --text:#e8edf2; --muted:#9aa7b4; --accent:#f97316; --accent2:#fb923c;
    --ok:#22c55e; --danger:#ef4444; --chip:#243b53; --chip-text:#7fb0e6;
    --chip2:#3a2a17; --chip2-text:#f0a868;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,#11161c,#0f1216);
    border-bottom:1px solid var(--line);
    padding:18px 20px 14px;
  }
  .title{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .title h1{font-size:20px; margin:0; font-weight:700; letter-spacing:.2px}
  .title .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .sub{color:var(--muted); font-size:13px; margin-top:2px}
  .toolbar{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:center}
  .search{flex:1 1 280px; position:relative}
  .search input{
    width:100%; padding:11px 38px 11px 38px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    font-size:15px; outline:none;
  }
  .search input:focus{border-color:var(--accent)}
  .search .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
  .search .clr{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--muted); cursor:pointer; border:none; background:none; font-size:18px}
  .btn{
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    padding:11px 14px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:.15s;
  }
  .btn:hover{border-color:var(--accent); color:#fff}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#1a1206}
  .btn.primary:hover{background:var(--accent2)}
  .btn.ghost{background:transparent}
  .stats{color:var(--muted); font-size:13px; margin-top:10px}
  .stats b{color:var(--text)}
  main{max-width:920px; margin:0 auto; padding:18px 16px 80px}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .pill{
    padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); cursor:pointer; font-size:13px; font-weight:600;
  }
  .pill.active{background:var(--accent); color:#1a1206; border-color:var(--accent)}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 16px 14px; margin-bottom:12px; transition:.15s;
  }
  .card:hover{border-color:#39444f}
  .q{font-weight:600; font-size:15.5px; margin:0 0 10px; display:flex; gap:10px}
  .q .num{color:var(--accent); font-weight:700; flex:none; min-width:26px}
  .a{
    background:var(--panel2); border-left:3px solid var(--ok); border-radius:8px;
    padding:10px 12px; color:#d6f5e0; font-weight:600; font-size:15px; white-space:pre-wrap;
  }
  .a.empty{color:var(--muted); font-weight:400; font-style:italic; border-left-color:var(--muted)}
  .meta{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap}
  .chip{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--chip); color:var(--chip-text); text-transform:uppercase; letter-spacing:.4px}
  .chip.medium{background:var(--chip2); color:var(--chip2-text)}
  .chip.mine{background:#1f3a2a; color:#7fe0a5}
  .actions{margin-left:auto; display:flex; gap:6px}
  .iconbtn{border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; padding:4px 8px; border-radius:6px; font-weight:600}
  .iconbtn:hover{background:var(--panel2); color:#fff}
  .iconbtn.del:hover{color:var(--danger)}
  mark{background:var(--accent); color:#1a1206; border-radius:3px; padding:0 2px}
  .empty-state{text-align:center; color:var(--muted); padding:60px 20px}
  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:16px}
  .overlay.show{display:flex}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; width:100%; max-width:560px; padding:22px}
  .modal h2{margin:0 0 4px; font-size:18px}
  .modal p.hint{margin:0 0 16px; color:var(--muted); font-size:13px}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; font-weight:600}
  textarea,select,.modal input{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:15px; font-family:inherit; outline:none; resize:vertical;
  }
  textarea:focus,select:focus,.modal input:focus{border-color:var(--accent)}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ok); color:#06210f; padding:12px 20px; border-radius:10px; font-weight:600;
    opacity:0; transition:.25s; z-index:100; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .fab{
    position:fixed; right:22px; bottom:22px; z-index:30;
    background:var(--accent); color:#1a1206; border:none; border-radius:50%;
    width:58px; height:58px; font-size:30px; cursor:pointer; box-shadow:0 6px 20px rgba(249,115,22,.45);
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .fab:hover{background:var(--accent2)}
  kbd{background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12px}
</style>
</head>
<body>
<header>
  <div class="title">
    <span class="dot"></span>
    <h1>Swedbank žinių žygis — База ответов</h1>
  </div>
  <div class="sub">Сборник вопросов и ответов. Ищите, добавляйте, редактируйте. Всё хранится в вашем браузере.</div>
  <div class="toolbar">
    <div class="search">
      <span class="ic">🔍</span>
      <input id="search" type="text" placeholder="Поиск по вопросу или ответу…  (нажмите / )" autocomplete="off">
      <button class="clr" id="clearSearch" title="Очистить" style="display:none">×</button>
    </div>
    <button class="btn primary" id="addBtn">＋ Добавить вопрос</button>
    <button class="btn ghost" id="saveFileBtn" title="Сохранить базу в файл">💾 Сохранить</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <div id="list"></div>
  <div class="empty-state" id="emptyState" style="display:none">Ничего не найдено 🤷</div>
</main>

<button class="fab" id="fabAdd" title="Добавить вопрос">＋</button>

<!-- Add/Edit modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Добавить новый вопрос</h2>
    <p class="hint">Вставьте вопрос и ответ. Если ответов несколько — каждый с новой строки.</p>
    <input type="hidden" id="editId">
    <label for="qInput">Вопрос</label>
    <textarea id="qInput" rows="3" placeholder="Введите вопрос…"></textarea>
    <label for="aInput">Ответ</label>
    <textarea id="aInput" rows="3" placeholder="Введите правильный ответ…"></textarea>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">Отмена</button>
      <button class="btn primary" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== SEED DATA ====== */
/* readme = iš pridėto dokumento (originalus lietuviškas tekstas)
   medium = iš straipsnio (klausimai gali būti aprašomieji; atsakymai – kaip pavyko ištraukti) */
const SEED = [
  // ---------- IŠ DOKUMENTO (README.TXT) ----------
  {q:"Kodėl investuojant svarbu yra diversifikuoti (įvairinti investicijas)?", a:"Tam, kad sumažinti riziką ir apsaugoti savo investicijas", source:"readme"},
  {q:"Kaip vadinamas nepagrįstų lūkesčių ir spekuliacijų sukeltas tam tikros kategorijos prekių kainų kilimas, pasibaigiantis sparčiu ir dideliu kainų smukimu?", a:"Kainų burbulu", source:"readme"},
  {q:"Kodėl verta kreiptis net tada, kai atrodo, kad niekas nepadės?", a:"Pokalbis gali padėti pamatyti išeitis ir nusiraminti", source:"readme"},
  {q:"Atsakyk, kas darys įtaką Jono paskolos kainai?", a:"Visi išvardinti variantai (ALL VAR)", source:"readme"},
  {q:"Naujiems automobiliams yra suteikiama garantija. Kiek metų ji trunka?", a:"Nuo 5 iki 7 m.", source:"readme"},
  {q:"Kuris tai rūbas?", a:"Marškinėliai (Майка)", source:"readme"},
  {q:"Kodėl verta kreiptis pagalbos kuo anksčiau?", a:"Kad sunkumai nesikauptų ir nepablogėtų", source:"readme"},
  {q:"Kiek CO₂ per metus išskiria tekstilės pramonė?", a:"1.7 mlrd", source:"readme"},
  {q:"Ką reiktų daryti supratus, kad atidavėte savo finansinius duomenis sukčiams?", a:"Visi atsakymai teisingi", source:"readme"},
  {q:"Ar norint sulaukti sėkmės, būtina pirkti akcijas tik tada, kai jų kainos yra itin žemame lygyje, o parduoti – kai jos pasiekia aukščiausią tašką?", a:"1 ir 2 (Ieškodami ir Svarbiausia)", source:"readme"},
  {q:"Tai yra pajamos, gautos už paslaugos teikimą, tokios kaip darbo užmokestis, arbatpinigiai, atlyginimai, komisiniai ir pajamos iš verslo, kuriame aktyviai dalyvaujama. Kas tai?", a:"Aktyvios pajamos", source:"readme"},
  {q:"1990 m. kovo 1 d. Lietuvoje buvo įsteigta viena svarbiausių įstaigų, kuri padėjo stiprų pamatą bankams Lietuvoje. Kaip ši įstaiga vadinasi?", a:"Lietuvos bankas", source:"readme"},
  {q:"Kaip vadinamas šis metodas?", a:"Linijinis paskolos grąžinimas", source:"readme"},
  {q:"Kaip Jaunimo linijos savanoriai ruošiasi teikti emocinę paramą?", a:"Jie lanko 4 mėnesių mokymus ir yra paruošiami atsakingai", source:"readme"},
  {q:"Kada verta kreiptis į Jaunimo liniją?", a:"Kai jauti sunkumą, vienišumą ar nerimą – bet kada", source:"readme"},
  {q:"Kokiu žodžiu vadinama strategija, kai investuojama į skirtingą turtą, siekiant sumažinti rizikas?", a:"Diversifikavimas", source:"readme"},
  {q:"Skandinavijoje ir kai kuriose Europos šalyse darosi nebemadinga turėti... Kiek automobilių? Įrašyk tik skaičių.", a:"2", source:"readme"},
  {q:"Kaip manai, kokių daiktų mes labiausiai nesame linkę pirkti panaudotų? Pasirink visus teisingus atsakymus.", a:"Audio / video / foto technika\nKompiuterinė technika\nIšmanusis telefonas", source:"readme"},
  {q:"22 2 66 55 2 7777 – koks žodis gaunasi paspaudus šiuos mygtukus?", a:"BANKAS", source:"readme"},
  {q:"Atsakyk, kokie asmenys iš išvardintų yra automatiškai draudžiami privalomuoju sveikatos draudimu?", a:"Studentai\nPensininkai\nMoksleiviai", source:"readme"},
  {q:"Pi – viena garsiausių matematinių konstantų. Ji švenčiama kiekvieną kovo mėnesį. Įrašyk, kurią dieną.", a:"14", source:"readme"},
  {q:"Trimis žodžiais įvardink, kaip vadinama įmonės strategija, kai rinkodaros tikslais apgaulingai skelbiama, kad įmonės politika, veikla ir produktai yra draugiški aplinkai, nors nieko bendro su tvarumu neturi?", a:"Žaliasis smegenų plovimas", source:"readme"},
  {q:"Kiek laiko yra matomos skolos kredito istorijoje?", a:"10 metų nuo skolos grąžinimo datos", source:"readme"},
  {q:"Nuotraukoje matomos monetos yra skirtos vienai baisiausių katastrofų, nutikusių žmonijos istorijoje. Kelintais metais įvyko Černobylio atominės elektrinės sprogimas?", a:"1986 m. balandžio 26 d.", source:"readme"},
  {q:"Kai lauke spaudžia nežmoniškas šaltis, savo automobiliu rūpintis reikia dar labiau. Kokius dalykus būtina padaryti, kai lauke didžiulis minusas?", a:"Patikrinti padangų slėgį\nPatikrinti kuro baką\nPatikrinti automobilio skysčius", source:"readme"},
  {q:"Kas tai tiksliai yra? Nežinai? Peržiūrėk video (nuo 12:20 minutės) ir atsakyk.", a:"Reiškinys, kai mažiau žinantys žmonės pervertina savo žinias, o daugiau žinantys – jas nuvertina", source:"readme"},
  {q:"Pirkimas išsimokėtinai – patogus sprendimas, leidžiantis įsigyti daiktą dabar ir visą pinigų sumą mokėti per nustatytą laikotarpį. Atsakyk, į ką svarbu atkreipti dėmesį?", a:"Gali tekti iš naujo planuoti ateities biudžetą", source:"readme"},
  {q:"Ką finansų pasaulyje reiškia apšilimas?", a:"Žinių, įgūdžių ir patirties kaupimas", source:"readme"},
  {q:"Kaip vadinamos tokios sisteminės mąstymo klaidos? Nežinai? Peržiūrėk video (nuo 8:35 minutės) ir atsakyk.", a:"Kognityviniai šališkumai", source:"readme"},
  {q:"Kaip E. taupyklė padeda sukaupti santaupų?", a:"Suapvalinant kortele mokamas sumas\nNustačius periodinius pervedimus į E. taupyklę", source:"readme"},
  {q:"Kuo ypatingas „Swedbank“ kortelės funkcionalumas „Click to Pay“?", a:"Nereikia kiekvieną kartą, apsiperkant internetu, suvesti kortelės duomenų", source:"readme"},
  {q:"Ar tiesa, kad tiek vykdant individualią veiklą, tiek dirbant pagal verslo liudijimą, reikia vesti apskaitą?", a:"Taip", source:"readme"},
  {q:"Kokiu anglišku žodžiu vadinamas judėjimas, kurio nariai siekia kuo anksčiau įgyti finansinę nepriklausomybę ir išeiti į pensiją?", a:"FIRE", source:"readme"},
  {q:"Pasitelk visas informacijos ieškojimo galias ir atsakyk – kas yra „pitch deck“?", a:"Prezentacija", source:"readme"},
  {q:"Kodėl? Nežinai? Peržiūrėk video (nuo 15:22 minutės) ir atsakyk.", a:"Didžioji dalis turinio yra užsakyta", source:"readme"},
  {q:"Pradinio kapitalo poreikis ir įmonės veiklai reikalingos įrangos įsigijimas – tai didžiausi verslo pradžios iššūkiai. Atsakyk, kas padeda su šiais iššūkiais susitvarkyti?", a:"Viską apimantis verslo planas", source:"readme"},
  {q:"Kiek zlotų uždirbo XX a. 4-ame dešimtmetyje Vilniuje gyvenęs stalius?", a:"Apie 5 zlotus", source:"readme"},
  {q:"Kaip įvardintum šį procesą?", a:"", source:"readme"},

  // ---------- IS STRAIPSNIO (medium.com) — tikslios formuluotes ----------
  {q:"Kur reikia kreiptis norint gauti valstybės remiamą paskolą studentams?", a:"Į Valstybinį studijų fondą", source:"medium"},
  {q:"Kiek rinkimų įvyks Lietuvoje 2024 m.?", a:"3", source:"medium"},
  {q:"Kokia yra metinė palūkanų norma už gynybos obligacijas?", a:"2 %", source:"medium"},
  {q:"Kas neįskaičiuojama į BVP pasirinkus išlaidų metodą?", a:"Darbo užmokestis", source:"medium"},
  {q:"Įmonės rinkodara yra tik išlaidos, ar įrankis, duodantis grąžą?", a:"Įrankis — prieš pradedant rinkodaros procesus labai svarbu paskaičiuoti, kokią finansinę vertę gali sukurti planuojami rinkodaros veiksmai", source:"medium"},
  {q:"Pagal „Swedbank“ Finansų instituto užsakytą tyrimą, didelė dalis studentų neįvertina, kiek iš tiesų pinigų reikia skirti maistui. Atsakyk, kokia tai dalis jaunuolių?", a:"44 %", source:"medium"},
  {q:"Ar tiesa, kad norint pradėti savo verslą, reikia turėti išgrynintą idėją?", a:"Tiesa, tai yra svarbi verslo sėkmės sudedamoji dalis", source:"medium"},
  {q:"Kokia kalba buvo iškaldintas užrašas?", a:"Latvių", source:"medium"},
  {q:"Ar prekybos centrų pardavėjai turi laisvę šiek tiek sumažinti prekės kainą klientui paprašius?", a:"Dauguma turi", source:"medium"},
  {q:"Apie JĄ dėsto Harvardo universitete, o JOS daroma įtaka ekonomikai apibūdinama kaip „JOSekonomika“. Kas ši atlikėja?", a:"Taylor Swift", source:"medium"},
  {q:"Ka daryti norint sėkmingai susitaupyti įnašą?", a:"Visi atsakymai teisingi", source:"medium"},
  {q:"Patardama, kaip valdyti išlaidas, “Swedbank” Finansų instituto vadovė Jūratė Cvilikienė pirmiausia rekomenduoja jas fiksuoti telefono užrašinėje. Kas kiek laiko Jūratė pataria tai daryti?", a:"Kasdien", source:"medium"},
  {q:"Įrašyk metus, kuriais Švedijoje buvo įkurtas „Swedbank“, tuo metu vadintas taupomuoju banku?", a:"1820", source:"medium"},
  {q:"Kokį minimalų įnašą reikia turėti norint gauti būsto paskolą?", a:"15 % būsto kainos arba vertės", source:"medium"},
  {q:"Augdami mes keičiamės — kinta mūsų požiūris, pomėgiai ar stilius. O ar investavimo pasaulyje gali keistis augimo akcijos?", a:"Gali", source:"medium"},
  {q:"Atsakyk, tiesa tai, ar melas?", a:"Tiesa Melas — studijų paskolos teikiamos su valstybės garantija, todėl grąžinimą užtikrinančios priemonės nereikalingos", source:"medium"},
  {q:"Kokiuose sektoriuose paprastai galime rasti daug augimo akcijų?", a:"Sektoriuose, kurių veiklos neriboja žaliavos ir fiziniai gamybos resursai", source:"medium"},
  {q:"Kokia tai dovana?", a:"20 Eur vertės „Swedbank“ Robur Acces Edge global“ fondo vienetų", source:"medium"},
  {q:"Investuojant patariama išlikti budriems ir renkantis augimo akcijas įvertinti keletą dalykų. Ar žinai, kokių?", a:"Abu variantai teisingi", source:"medium"},
  {q:"Ar pagal tą patį tyrimą buvo pastebėtas didesnis skepticizmas nuomonės formuotojų atžvilgiu?", a:"Taip, nuomonės formuotojai dažniau pasisako už konkrečias investavimo priemones ar būdus, kurie nėra tinkami visiems, tad jų aktualumas mažėja", source:"medium"},
  {q:"Biudžetą sudaro tavo pajamos ir išlaidos, o kas sudaro finansinę sveikatą?", a:"Gebėjimas taupyti ir atsakingai planuoti išlaidas", source:"medium"},
  {q:"Ar tiesa, kad „Swedbank“ teikia privalomąjį vairuotojų draudimą?", a:"Taip", source:"medium"},
  {q:"Kokia yra šio Lietuvos Prezidento profesija?", a:"Ekonomistas", source:"medium"},
  {q:"Ar investicijas būtina nuolatos stebėti?", a:"Rekomenduojama skirti kelias valandas per savaitę perskaityti naujienoms apie tave dominančias kompanijas", source:"medium"},
  {q:"Viena iš idėjų — mokytojas prestižinė profesija. Iki kelintų metų, pagal idėją, mokytojo profesija turėtų tapti prestižine?", a:"Iki 2025 m.", source:"medium"},
  {q:"Pagalvok ir atsakyk, kuo skiriasi vertės ir augimo įmonės?", a:"Vertės įmonės įprastai yra lėčiau augančios ir stabilesnės už augimo įmones", source:"medium"},
  {q:"„Swedbank“ pavadinimas naudojamas nuo 2009 metų. O kaip bankas vadinosi anksčiau?", a:"„Hansabank“", source:"medium"},
  {q:"Giliausias Lietuvos ežeras yra Tauragnas — jo gylis viršija 60 metrų! O ką gylis reiškia investavime?", a:"Kiek konkrečių akcijų ir už kokią kainą žmonės perka ir parduoda šiuo metu", source:"medium"},
  {q:"Ar žinojai, kad pirmieji kilmingųjų asmenų ir žemių herbai Lietuvoje atsirado XIV a. pabaigoje?", a:"5", source:"medium"},
  {q:"Pagalvok, ar realu tikėtis greitų rezultatų investavimo srityje?", a:"Melas, per ilgus metus yra pasitvirtinęs vienas faktas — rinkos apdovanoja pačius kantriausius", source:"medium"},
  {q:"Pinigėliai ir pinigai Likvidumas — tai galimybė greitai ir su minimaliais nuostoliais turtą paversti grynaisiais pinigais. Ar tiesa, kad fonduose ir (ar) akcijose laikomi pinigai yra nelikvidūs?", a:"Netiesa", source:"medium"},
  {q:"Pabandykime dar Susidūrus su nesėkme, verslininkams yra labai svarbu įvertinti parduodamos prekės perspektyvas. Juk visada galima pabandyti iš naujo! Įsivertinti perspektyvas padeda specialūs klausimai. Atsakyk, kuris iš išvardintų klausimų nėra tinkamas produkto perspektyvai vertinti?", a:"Ar tavo produktas yra pigiausiais rinkoje?", source:"medium"},
  {q:"Ne raketų mokslas Investavimas yra vienas iš būdų ilguoju laikotarpiu padidinti savo finansinį turtą ir užsitikrinti finansinę laisvę. Ar tiesa, kad norint investuoti, reikia būti diplomuotu ekspertu?", a:"Netiesa, pradėti investuoti galima nuo paprastų priemonių — akcijų, obligacijų, fondų — apie šias priemones galima mokytis ir savarankiškai", source:"medium"},
  {q:"Surašius visus sveikuosius skaičius nuo 1 iki 200, kiek kartų naudojamas 1?40 140 150 170", a:"140", source:"medium"},
  {q:"Lauk mitus iš galvos! Investuotojai prisiima riziką, kad investuota pinigų suma gali ir išaugti, ir sumažėti. Ar tiesa, kad investuoti — tai lyg lošti loterijoje arba kazino?", a:"Melas, investuojant rizika yra nepalyginamai mažesnė", source:"medium"},
  {q:"Greiti sprendimai Jonas užsibrėžė tikslą — per 2 mėnesius praplėsti savo verslą. Padėk Jonui tam pasiruošti! Kuo svarbu pasirūpinti planuojant sparčią verslo plėtrą?", a:"Finansavimu iš išorės", source:"medium"},
  {q:"Apie kokią instituciją iš tiesų kalba močiutė?", a:"Užimtumo tarnybą", source:"medium"},
  {q:"Norint naudotis elektronine bankininkyste, tau reikės turėti „Naudotojo ID“. Kiek skaitmenų sudaro šį kodą?", a:"7", source:"medium"},
  {q:"Sunku ar lengva? Ar taupyti iš tiesų yra sudėtinga? Norint taupyti lengviau, labai svarbu yra turėti… Ką?", a:"Aiškų tikslą", source:"medium"},
  {q:"Žili žili Ar darbo rinka gali imti ir pražilti? Kaip vadinama ekonominė aplinka, apimanti vyresnio amžiaus žmonių dalyvavimą darbo rinkoje?", a:"Sidabrinė ekonomika", source:"medium"},
  {q:"Rūpinuosi nuolat Tvarkyti ir prižiūrėti savo finansus turime nuolat — visai kaip ir rūpinantis savo sveikata. Juk nesprendžiant problemų sveikata tik prastėja! Atsakyk, koks yra pagrindinis finansinio nerimo požymis?", a:"Vengi tiesos apie savo asmeninius finansus", source:"medium"},
  {q:"Atrask, kokių raidžių joje trūksta ir užrašyk iš jų susidedantį žodį, kuris būtų susijęs su finansais! Atsakymą įrašyk didžiosiomis raidėmis.", a:"SKOLA", source:"medium"},
  {q:"Staigūs šuoliai laukia ne tik amerikietiškuose kalneliuose, bet ir investavime!", a:"Nuolatos svyruoja", source:"medium"},
  {q:"Kokia dabar (2024 pradžioje) yra minimali mėnesio alga Lietuvoje?", a:"du\n924 Eur neatskaičius mokesčių\n709 Eur atskaičius mokesčius", source:"medium"},
  {q:"Nuotraukoje tu matai taktilinį taką. Kokia yra šių takų reikšmė?", a:"Padeda akliesiems savarankiškai orientuotis aplinkoje", source:"medium"},
  {q:"Laikyk ir užsidirbk Bankas — saugiausia vieta laikyti savo pinigus. Bet ar žinojai, kad laikydamas savo pinigus banke gali ir užsidirbti? Jei nori investuoti ir panaudoti tuos pinigus jau per ateinančius kelis metus, reikėtų pasvarstyti apie… Ką?", a:"Indėlius, Vyriausybės taupymo lakštus", source:"medium"},
  {q:"Tiesa ar apgaulė? Perskaityk pateiktą informaciją ir atsakyk, tiesa tai ar melas! Bankas, pastebėjęs neaiškius veiksmus tavo banko sąskaitoje, atsiųs tau SMS arba parašys per „Messenger“ programėlę ir tave įspės. Bankas paprašys prisijungimo kodų arba atsiųs aktyvias nuorodas.", a:"Melas, taip elgiasi tik sukčiai!", source:"medium"},
  {q:"Disciplina Norint investuoti yra svarbu išmokti valdyti savo finansus. Bet kartais geriau planuoti savo finansus padeda pats investavimas! Koks investavimo būdas ugdo finansinę discipliną ir priverčia investuotoją atidžiau planuoti savo finansus?", a:"Periodinis investavimas", source:"medium"},
  {q:"Sukčiai nemiega! „Swedbank“ saugumo ekspertai įspėja — plinta naujas sukčiavimo būdas. Ar tiesa, kad per įvairias pokalbių programėles siunčiamose žinutėse siūloma užsidirbti, peržiūrėjus „Youtube“ vaizdo įrašus?", a:"Tiesa, sukčiai siūlo 2–5 eurus už įrašą, vėliau prašo sumokėti narystės mokestį, o jį sumokėjus — pradingsta", source:"medium"},
  {q:"Atsakingas investavimas Investavimas visuomet susijęs su rizika, tačiau su žiniomis, planavimu ir atsakingais sprendimais galime išvengti rizikos ir pasiekti naudą! Peržiūrėk video ir atsakyk, kokiu metu turime nuspręsti, kada parduosime įsigytą akciją?", a:"Prieš ją perkant", source:"medium"},
  {q:"Ar tiesa, kad darbo skelbime darbdavys privalo nurodyti darbo užmokest arba jo ribas?", a:"Tiesa", source:"medium"},
  {q:"Mažiau ar daugiau? Investavimo rizika yra mažesnė, kai investuoji įvairiai — diversifikuoji. Įrašyk praleistą žodį: kuo investuojama suma yra ____, tuo labiau reikėtų ją diversifikuoti.", a:"Didesnė", source:"medium"},
  {q:"Kaip vadinama tokia išmoka?", a:"Kompensacija", source:"medium"},
  {q:"Perklausyk šią dainą ir atsakyk, kiek skirtingų valiutų joje paminėta?", a:"9", source:"medium"},
  {q:"Startuolių akceleratorių programoje vyksta demonstracinė diena. Pagalvok ir atsakyk, koks yra jos tikslas?", a:"Demonstruoti startuolių pažangą ir pritraukti potencialius investuotojus", source:"medium"},
  {q:"Privalai susipažinti Nežinojimas neatleidžia nuo atsakomybės — ši taisyklė galioja viskam! Su kuo investuotojas turi kruopščiai susipažinti atidarydamas vertybinių popierių sąskaitą?", a:"Su sutarties sąlygomis", source:"medium"},
  {q:"Paskaitos Sąvoką „product-market fit“ tu tikriausiai pažintumei paskaitoje apie verslą. Bet kam laukti ateities — gaudyk žinias dabar! Atsakyk, ką reiškia „product-market fit“?", a:"Etapas, kuriame produktas tenkina didelę rinkos paklausą", source:"medium"},
  {q:"Pažiūrėk į nuotrauką ir atsakyk, kas šis žmogus?", a:"Nerijus Mačiulis", source:"medium"},
  {q:"Nuo kelintų metų „Maisto bankas“ veikia Lietuvoje?", a:"2001 m.", source:"medium"},
  {q:"Spektaklis dovanų Swedbank“ 2023 gruodžio mėnesį gyventojams padovanojo 4 dalių videospektaklį „Švenčių belaukiant“. Videospektaklyje šventėms ruošėsi šeima, kurią įkūnijo aktoriai Giedrius Savickas ir ___. Atsakyk, kas vaidino kartu?", a:"Milda Noreikaitė", source:"medium"},
  {q:"Visiškai savarankiškas ir nepriklausomas gyvenimas kvėpuoja tau į nugarą? Atmink, kad laisvė nėra neribota!", a:"atsakomybė", source:"medium"},
  {q:"Pažink vienaragį Kas yra vienaragis startuolių pasaulyje tu jau žinai. Metas žvilgtelėti į pavyzdžius! Pagalvok ir atsakyk, kuris iš toliau išvardytų pavyzdžių yra vienaragio įmonės pavyzdys?", a:"„Uber“", source:"medium"},
  {q:"Valio maisto suvartojimui! Lietuvoje pastebima nauja tendencija — namuose rečiau švaistomas maistas! Dažniausiai gyventojai maistą išmeta kartą per mėnesį. Atsakyk, kokį maistą gyventojai išmeta dažniausiai?", a:"Daržoves", source:"medium"},
  {q:"Nori ateityje sukurti ir valdyti verslą? Prieš verslo kūrimą, nepamiršk atlikti atitinkamus skaičiavimus ir prognozes, kurios leis verslą planuoti ir stebėti efektyviau bei paprasčiau.", a:"Pinigų srauto prognozė", source:"medium"},
  {q:"„M&A“ — tai visai ne nauja saldumynų rūšis. Atsakyk, ką versle reiškia angliškas akronimas „M&A“? [Mergers and acquisitions]", a:"Susijungimai ir įsigijimai", source:"medium"},
  {q:"Kaip yra? Tiesa ar melas? Pagalvok ir atsakyk! Tiesa ar melas, kad sausio 1 dieną švenčiame ne tik Naujuosius metus, bet ir Lietuvos vėliavos dieną?", a:"Tiesa", source:"medium"},
  {q:"Paklaustas, ar kada nors investuos į kriptovaliutas, vyriausias „Swedbank“ ekonomistas Nerijus Mačiulis atskleidė, kad kol kas kripto aktyvų neturi, nes daugelyje nemato…Atsakyk, ko?", a:"Fundamentalios vertės", source:"medium"},
  {q:"Begalė pasirinkimų! Ką rinktis norint išmokti investuoti? Pasyvų investavimą, ar sudėtingesnes investavimo priemones? Norint išmokti investuoti ir tobulėti šioje srityje, „Swedbank“ ekspertas pataria rinktis sudėtingesnį investavimo būdą, pavyzdžiui…Kokį?", a:"Nusipirkti įmonės akcijų", source:"medium"},
  {q:"Prognozuodamas akcijų kainas, vyriausias „Swedbank“ ekonomistas Nerijus Mačiulis didelį dėmesį skiria palūkanų normoms, kadangi įmonės vertė priklauso nuo to, kaip diskontuojami jos ateities pinigų srautai.", a:"mažesnė", source:"medium"},
  {q:"Pamačiau ir pamečiau 1 ir 2 centų monetos dažniausiai yra panaudojamos tik vieną kartą. Kodėl? Nes labai dažnai jas pametame! Kiek iš viso tokių euro monetų jau esame pametę?", a:"2 milijonus eurų", source:"medium"},
  {q:"Koks makroekonominis rodiklis, pasak „Swedbank“ vyriausio ekonomisto Nerijaus, artimai koreliuoja su įmonių pelno maržomis?", a:"BVP", source:"medium"},
  {q:"Atsakyk, kaip vadinamas procesas, kai startuolis yra parduodamas didesnei įmonei?", a:"Įsigijimas", source:"medium"},
  {q:"Užteks visiems Ar žinai, kad 700-ojo Vilniaus gimtadienio proga buvo sukurta speciali kolekcinė moneta? Kokia institucija Lietuvoje rūpinasi, kad grynųjų pinigų kiekis rinkoje būtų pakankamas?", a:"Lietuvos bankas", source:"medium"},
  {q:"Visur yra ribos “ „Turiu šios įmonės akcijų, prašau imti ir atiduoti man šį monitorių!“ , — pasakė Vaidas. Ar Vaidas šioje situacijoje yra teisus? Ar turėdamas įmonės akcijų, esi ir įmonės turto, pavyzdžiui, ofise esančio kavos aparato, savininkas?", a:"Ne, turėdamas įmonės akcijų turi nuosavybės teisę į įmonę, tačiau ne į jos turtą", source:"medium"},
  {q:"Visai čia pat „Swedbank“ ekspertas investuojant rekomenduoja toli nesidairyti ir rinktis vietinę, Baltijos šalių akcijų rinką. Peržiūrėk video ir atsakyk, kodėl?", a:"Prieš investuojant bus lengviau įsivertinti ir pažinti kompaniją bei jos veiklą", source:"medium"},
  {q:"Su rūpesčiu Patarimas: perkant drabužius, pagalvok, ar rūbo tau tikrai reikia — neatsakingai perkami ir vėliau nedėvimi bei išmetami drabužiai tampa atliekomis, kurias skaičiuojame tonomis! Pasaulis rūpinasi tvaria mada, todėl Europos Parlamentas ir Europos Sąjungos valstybės narės priėmė naujas taisykles, kuriomis siekiama kovoti su greitąja mada ir mažinti atliekų kiekį. Koks naujas reikalavimas buvo priimtas 2023m. ?", a:"Įstatymu draudžiama naikinti neparduotus tekstilės gaminius ir avalynę", source:"medium"},
  {q:"Mada ar investicijos? Ar investavimas ir madingos prekės turi kažką bendro? Ar padidėjęs TESLA automobilių skaičius gatvėse nurodo, kad reikėtų investuoti į šią įmonę?", a:"Ne, nes tai, ką mes matome Lietuvoje, neatspindi pasaulinės rinkos", source:"medium"},
  {q:"Eksperto įžvalga Kaip manai, investuoti geriau nuolat, ar tada, kada sugalvoji? Ekspertai sako, kad investavimas nuolat, kad ir nedidelėmis sumomis, yra tvarus būdas siekti savo finansinių tikslų. Žinodamas tai, atsakyk, kas yra periodinis investavimas?", a:"Investavimo strategija, kai investuotojas reguliariai investuoja fiksuotą pinigų sumą, neatsižvelgdamas į akcijų rinkos rezultatus", source:"medium"},
  {q:"Dega ne tik kalorijos! „Burn rate“ sąvoka tau gali priminti sporto metu sudeginamas kalorijas. Bet startuoliai kalorijų nedegina! Atsakyk, ką vadiname „burn rate“, kai kalbame apie startuolius?", a:"Greitį proceso, kai startuolio išlaidos viršija pajamas", source:"medium"},
  {q:"Banko reikalai Kasdieniai finansai, kortelės, draudimai… Turim tau dar vieną su banku susijusią sąvoką! Atsakyk, kas yra kredito limitas?", a:"Tai kredito suma, kurią bankas suteikia kredito kortelės turėtojui", source:"medium"},
  {q:"Įrašyta į istoriją! Nuo 2015 m. sausio 1 d. Lietuvoje buvo įvestas euras ir mūsų šalis tapo 19-ąja euro zonos nare. Tiesa ar melas, kad iš visų Baltijos šalių Lietuva buvo pirmoji įsivedusi eurą? Tiesa Melas", a:"Melas", source:"medium"},
  {q:"Knyga dovanų Kiekvienais metais „Swedbank“ dovanoja knygą aktualia tema. 2023 metais — tai perfekcionizmą analizuojanti Thomas Curran knyga „Tobulumo spąstai“! Atsakyk, ar šią knygą galima perklausyti „Spotify“ platformoje?", a:"Taip", source:"medium"},
  {q:"Kur reikėtų investuoti? Labiau apsimoka investuoti į rankinuką, ar į nekilnojamą turtą? Naują automobilį, ar į fondus? Paklaustas, ar verta investuoti į rankinuką, Swedbank vyriausiasis ekonomistas Nerijus Mačiulis atsakė, kad investuoti į rankinuką neteko, tačiau pabrėžė, kad prabangos prekėms būdingas____ kainų svyravimas. Atsakyk, koks žodis yra praleistas?", a:"mažesnis", source:"medium"},
  {q:"Valstybės reikalai 2019 m. Ūkio ministerija buvo pavadinta Ekonomikos ir inovacijų ministerija. Lietuvoje iš viso yra 14 ministerijų. Atsakyk, kuri iš nurodytų ministerijų neegzistuoja?", a:"Biudžeto ministerija", source:"medium"},
  {q:"Įskaito iš karto? Prieš kažką įsigydamas, turi nusipirkti. O kaip yra su investavimu? Ar investuojant į akcijas sandorio sudarymas ir akcijų įskaitymas į vertybinių popierių sąskaitą vyksta vienu metu?", a:"Ne, akcijos paprastai įskaitomos per 2 dienas", source:"medium"},
  {q:"Saugiai laikomos santaupos “ Vyriausybės taupymo lakštai leidžia Vyriausybei pasiskolinti iš gyventojų ir taip pritraukti santaupas, neinvestuotas kitur. “ Pagalvok ir atsakyk, ar investicijos į Vyriausybės taupymo lakštus svyruoja taip, kaip investicijos į akcijas ir fondus?", a:"Ne, šios investicijos yra stabilesnės", source:"medium"},
  {q:"Nesnaudžia! Pinigus išvilioti bandančių sukčių aktyvumas nuolat auga — vien per antrąjį 2023 metų ketvirtį „Swedbank“ inicijavo 1,7 tūkst. tyrimų dėl sukčiavimo atvejų! Sukčių pasitaiko ir investavimo srityje. Atsakyk, kurie iš išvardytų požymių signalizuoja apie galimą investavimo sukčių? Nepamiršk, kad gali rinktis net kelis atsakymus!", a:"Žadamas greitas ir įspūdingas uždarbis\nNaudojama agresyvi reklama su žinomų asmenų sėkmės istorijomis, žinomais prekės ženklais ar institucijų pavadinimais\nDidelis ir įtaigus konsultantų spaudimas didinti investavimo sumą\nInvestuoti siūlančios įmonės yra registruotos egzotiškose šalyse\nNesėkmės atveju žadama susigrąžinti prarastus pinigus pasinaudojant „Mastercard“ draudimo paslauga arba siūloma už tam tikrą mokestį padėti susigrąžinti pinigus", source:"medium"},
  {q:"Vyriausybė ir taupymas Ar esi girdėjęs apie Vyriausybės taupymo lakštus? Vyriausybės taupymo lakštai yra investavimo būdas, kai gyventojai savo santaupas patiki Vyriausybei. Pagalvok ir atsakyk, kada galima įsigyti taupymo lakštus?", a:"Finansų ministerijos nurodytu metu", source:"medium"},
  {q:"Kuriu verslą Svajoji apie nuosavą verslą? Tau reikės įsteigti įmonę ir pasirinkti jos formą! Atsakyk, kokia įmonės forma Lietuvoje neegzistuoja?", a:"Didžioji akcinė bendrovė", source:"medium"},
  {q:"Renkuosi kai suprantu Tomas nori investuoti į nekilnojamajį turtą. Ieškodamas informacijos jis suprato, kad gali tai daryti keliais būdais: investuoti tiesiogiai arba investuoti į nekilnojamojo turto fondus. Ką išsirinkti? Pirmiausia reikia suprasti, kuo šios investicijos skiriasi. Padėk Tomui surasti teisingą atsakymą!", a:"Investavimas į fondus užtikrina geresnį likvidumą ir galimybę investuoti mažesnėmis sumomis", source:"medium"},
  {q:"Smaližių testas Susipažink su testu, kuris savo pavadinimu neprimena nei kontrolinio mokykloje, nei egzamino universitete! Šis testas yra skirtas patikrinti vaikų kantrybę. Tokiu pačiu principu veikia ir taupymas — neišleidus pinigų dabar, ateityje mūsų lauks geresnis ir didesnis pirkinys. Atsakyk, kokio skanėsto pavadinimu vadinamas šis testas?", a:"Zefyro", source:"medium"},
  {q:"Ar veikia labiau? Nekilnojamojo turto fondai įprastai yra susiję su skolomis. Kaip manai, ar juos gali paveikti palūkanų normos ir infliacija? Žinoma, kad gali! Pagalvok ir atsakyk, ar palūkanų normos bei infliacija nekilnojamojo turto fondus veikia labiau nei akcijų ir obligacijų fondus?", a:"Taip, veikia labiau", source:"medium"},
  {q:"Kuriant verslą, nesėkmės yra dalis proceso, tad jų nereikia bijoti, o atvirkščiai — priimti ir pasimokyti! Kokią nepelningą kompaniją Beata Nicholson įkūrė, prieš paversdama ją į savo knygas ir žurnalus leidžiančią įmonę?", a:"Prijuosčių siuvimo įmonę", source:"medium"},
  {q:"Dėlionė Investavimas gali priminti dėlionę — kai trūkstamas žinias užpildome ekspertų informacija, viskas tampa daug paprasčiau ir aiškiau! Papildyk eksperto Edgaro teiginį tinkamu žodžiu: investicinių nekilnojamojo turto fondų struktūra yra ____ nei akcijų ir obligacijų fondų.", a:"sudėtingesnė", source:"medium"},
  {q:"O jeigu kitaip? Tu jau padėjai Justinai sužinoti pinigų sumą sąskaitoje po 5 metų. O jei viskas būtų kiek kitaip? Įsivaizduok, kad Justinos taupomosios sąskaitos metinė palūkanų norma buvo 1 proc., o metinė infliacija — 2 proc. Kiek po 1 metų Justina galėtų nusipirkti už šioje sąskaitoje esančius pinigus?", a:"Mažiau nei šiandien", source:"medium"},
  {q:"Akcijos atrakcijos Tu puikiai žinai, kad akcijos gali reikšti ne tik nuolaidas parduotuvėje! Atsakyk, kas yra akcijų rinka?", a:"Akcijų rinka yra platforma, kurioje viešai prekiaujama įmonių akcijomis", source:"medium"},
  {q:"Kažkam tikrai patinka Ar visada bus žmonių, kuriems nepatiks, ką tu darai? Tikriausiai taip! Ar dėl to reikia nustoti siekti savo tikslo? Ne! Sulaukusi populiarumo, Beata Nicholson neišvengia ir kritikos, tačiau ji sako, kad žmonių, kuriems patinka tai, ką darai, visada bus… Kiek?", a:"Daugiau", source:"medium"},
  {q:"Ar norint sulaukti sėkmės, būtina pirkti akcijas tik tada, kai jų kainos yra itin žemame lygyje, o parduoti — kai jos pasiekia aukščiausią tašką?", a:"Ieškodami tobulos progos, galime ne tik ją praleisti, bet ir sugaišti daug laiko, taip ir nepasiekę jokio apčiuopiamo rezultato\nSvarbiausia pradėti investuoti tuomet, kai leidžia finansinės galimybės, ir pasiryžti daryti tai tiek ilgai, kiek galime", source:"medium"},
  {q:"Kokio dydžio įmoką turi sumokėti savarankiškai besidraudžiantys asmenys 2024 metais?", a:"64,50 Eur", source:"medium"},
  {q:"Šokolado kalnai Marija turi sėkmingą šokolado verslą, tačiau vienas iš produktų, juodas šokoladas, perkamas itin retai. Marija nežino, ar tikrai verta juo prekiauti. Atsakyk, apie ką reikia pagalvoti Marijai norint ir toliau prekiauti prasčiau parduodamu šokoladu?", a:"Visi atsakymai teisingi", source:"medium"},
  {q:"Investicija į ateitį Taip galime pavadinti kaupimą pensijai — viskas tam, kad pensinį amžių galėtumei pasitikti su džiaugsmu! Kurioje pensijų pakopoje pensijai yra kaupiama savarankiškai?", a:"III", source:"medium"},
  {q:"Finansinių patarimų knygoje paaugliams Beata Nicholson dalijosi savo verslo kūrimo patirtimi. Ji išskiria dvi itin svarbias savybes, kurios praverčia jai ne tik dirbant televizijoje, bet ir kasdieniame gyvenime. Atsakyk, kokios tai savybės?", a:"Drąsa ir laisvumas", source:"medium"},
  {q:"Ką šie skaičiai nurodo?", a:"Nurodo, kokią fondo dalį sudaro investicijos į akcijas", source:"medium"},
  {q:"Ar investavus į obligacijas galima tikėtis stabilaus pajamingumo iš savo investicijos? Pajamingumas — tai investicijos arba kito tipo turto gebėjimas generuoti pajamas.", a:"Taip, jeigu investavus į obligacijas investicija išlaikoma iki obligacijų išpirkimo", source:"medium"},
  {q:"Balansuojam! Subalansuota mityba, sportas, darbas, poilsis — gyvenime balansas yra laaabai svarbus. Pasirodo, jį rasti gali ir investavime! Galima investuoti į subalansuotus fondus! Pagalvok ir atsakyk, kuo jie skiriasi nuo kitų investicinių fondų?", a:"Šie fondai yra konkrečiai aprašę savo strategiją ir paskirsto investicijas į akcijas (aukštesnės rizikos) ir obligacijas (žemesnės rizikos), kurias prižiūri profesionalus investicijų valdytojas.", source:"medium"},
  {q:"Investicijų skirtumai Vienos investicijos yra daugiau rizikingos, o kitos mažiau. Kurios? Pagalvok ir atsakyk, kurios investicijos paprastai yra rizikingesnės, bet gali atnešti didesnį pelną?", a:"Akcijos", source:"medium"},
  {q:"Susipažinkime su EURIBOR! Ar žinai, kas yra EURIBOR? Tai orientacinis palūkanų dydis Europos ekonominėje ir pinigų sąjungoje, kurį skaičiuoja ir skelbia Europos bankų federacija. Tiesa ar melas: palūkanų normų fiksavimas reiškia, kad bet kuriuo momentu galima pasirinkti tuo metu galiojančio EURIBOR užfiksavimą.", a:"Melas", source:"medium"},
  {q:"Viskas paprasta Pasivaikščiokim investavimo takais — viskas daug paprasčiau, nei manai! Rask pagrindinius skirtumus — kuo skiriasi akcijos nuo obligacijų?", a:"Akcijos reiškia nuosavybės teisę į įmonę, o obligacijos — paskolą įmonei ar vyriausybei", source:"medium"},
  {q:"Tam tikri maisto produktai yra išskiriami kaip didžiausią CO2 pėdsaką turintys produktai. Atsakyk, kokie?", a:"Mėsos produktai", source:"medium"},
  {q:"Ištiesta pagalbos ranka Turint finansinių sunkumų grąžinant paskolą, rekomenduojama pasikalbėti apie tai su banku — specialistai padės rasti individualius problemos sprendimus! Kokiu atveju bankas gali pasiūlyti atidėti būsto paskolos įmokų mokėjimą, jei klientas susiduria su sunkumais grąžinant paskolą?", a:"Kai nutrūksta kredito gavėjo santuoka", source:"medium"},
  {q:"Nuo pradžių! Susipainiojai investavimo platybėse? Pradėkim nuo pačių pradžių! Peržiūrėk video ir atsakyk, koks, pasak Tautvydo, yra pirmas atskaitos taškas renkantis fondą, į kurį investuoti?", a:"Fondo pavadinimas", source:"medium"},
  {q:"Mašinų taršą Nors automobilis yra viena iš patogiausių susisiekimo priemonių, ji sava tarša prisideda prie klimato kaitos. Todėl Europos Sąjunga planuoja daryti tvarką! Europos Sąjungos planuose — draudimas parduoti naujus automobilius su vidaus degimo varikliais. Atsakyk, nuo kurių metų siekiama šį planą įgyvendinti?", a:"Nuo 2035 m", source:"medium"},
  {q:"Susipažink akimirksniu! Susipažink su dividendinėmis akcijomis prekiaujančiomis įmonėmis — tai rinkoje įsitvirtinusios įmonės, kurios telkia dėmesį į pelno, o ne pačios įmonės augimą.", a:"…investicinė grąža ir rizika bus mažesnės", source:"medium"},
  {q:"Kaip vadinama įmonės pelno dalis, kuri yra išmokama įmonės akcininkams?", a:"Dividendai", source:"medium"},
  {q:"Praktika moko geriausiai! Per tikras patirtis ateina vertingos pamokos — ar žinojai, kad gali praktikuotis investavimo? Tu gali investuoti netikrus pinigus investuodamas į demo akcijas. Atsakyk, ką svarbu žinoti investuojant į demo akcijas?", a:"Investuojant į demo akcijas investuotojo rizikos įvertinimas ir elgesys dažnai skiriasi, todėl perėjus prie tikrų akcijų reikia labai gerai įsivertinti riziką", source:"medium"},
  {q:"Skolinuosi ir apgalvoju Skolinimosi būdų yra daug: vartojimo paskolos, ilgalaikės banko paskolos, lizingas… Saugant savo finansinę sveikatą labai svarbu pasirinkti optimaliausią ir labiausiai sau tinkamą skolinimosi būdą. Pagalvok ir atsakyk, kuris iš skolinimosi būdų yra lengvai prieinamas, tačiau jam būdingos aukštos palūkanos?", a:"Greitieji kreditai", source:"medium"},
  {q:"Tam, kad išvengtume nemalonių netikėtumų ir palaikytume finansinę sveikatą, svarbu laiku ir teisingai grąžinti pasiskolintus pinigus. Atsakyk, kaip yra vadinami du pagrindiniai paskolos grąžinimo metodai?", a:"Anuitetinis ir linijinis", source:"medium"},
  {q:"Sumanus verslas Kiekvieną mėnesį verslui rekomenduojama atidėti bent 10 proc. mėnesio pelno, kad įmonė sukauptų 6 mėn. išlaidų rezervą. Tačiau ką daryti, jei įmonė jau turi tokį rezervą? Pagalvok ir atsakyk, kur būtų galima sumaniai panaudoti atidėtus 10 % pelno?", a:"Investavimui — taip atsiras galimybė uždirbti papildomą pelną", source:"medium"},
  {q:"Veiklų, vykdomų pagal verslo liudijimą išties gali būti įvairių — pažymėk veiklas, kurias Vilius rado klasifikatoriuje. Nepamiršk, kad gali rinktis net kelis atsakymus!", a:"Trūklių lervų gaudymas\nArklių kaustytojų veikla\nBatų valymas", source:"medium"},
  {q:"Tarša ir rūbai Sulėtink greitąją madą — prieš perkant naują drabužį, pagalvok, ar tau tikrai jo reikia! Europos aplinkos agentūros duomenimis, pasaulyje kasmet pagaminama maždaug 109 mln. tonų tekstilės gaminių, o pasaulinės tekstilės atliekos per metus sudaro daugiau nei X tonų. Kas yra X?", a:"90 mln.", source:"medium"},
  {q:"Investuoti galime net ir labai mažomis sumomis, tačiau visada svarbu įsivertinti ir kitą su pinigais susijusį dalyką. Atsakyk, kokį?", a:"Komisinius mokesčius", source:"medium"},
  {q:"Ne visai — asmeninis automobilis dažniausiai nėra investicija. Jį labiau reikėtų traktuoti kaip….. Kaip ką?", a:"Išlaidas", source:"medium"},
  {q:"Padėk Monikai Monika pasiklydo tarp akcijų rinkos kainos ir vertės. Padėk jai nuspręsti, į kokias akcijas reiktų investuoti! Pagalvok ir atsakyk, į kokias akcijas Monika turėtų investuoti?", a:"Į akcijas, kurių vertė yra didesnė nei rinkos kaina biržoje", source:"medium"},
  {q:"Ne juokai Verslo įkūrimas — ne juokai, todėl pradžia gali kelti tam tikrų iššūkių. Būk pasiruošęs! Pradinio kapitalo poreikis ir įmonės veiklai reikalingos įrangos įsigijimas — tai didžiausi verslo pradžios iššūkiai. Atsakyk, kas padeda su šiais iššūkiais susitvarkyti?", a:"Viską apimantis verslo planas", source:"medium"},
  {q:"Savo individualią veiklą tu gali įforminti skirtingais būdais: turėti individualios veiklos pažymą arba verslo liudijimą. Atsakyk, kurį būdą geriau pasirinkti, jei iš savo veiklos planuoji gauti nuolatines pajamas?", a:"Individualios veiklos pažymą", source:"medium"},
  {q:"Atsakyk, kokia yra didžiausia naujo automobilio grėsmė, kurią turėtų žinoti Rūta?", a:"Nuvertėjimas", source:"medium"},
  {q:"Finansinės sveikatos savaitės iššūkis: Ar turi šį įprotį?", a:"Visi atsakymai teisingi", source:"medium"},
  {q:"Atsakyk, kuo skiriasi akcijos rinkos kaina nuo vertės?", a:"Rinkos kaina nusako už kokią pinigų sumą akcija yra perkama ir parduodama biržoje, o vertė nėra skelbiama, ją investuotojas turi susiskaičiuoti ir numatyti pats", source:"medium"},
  {q:"Kodėl pradedančiąjam investuotojui yra palankiau investuoti į akcijų fondus, nei pirkti pavienes akcijas?", a:"Investicinius fondus sudaro ne vienos, o daugybės bendrovių akcijos, todėl jei vienai bendrovei seksis prasčiau, o kitai puikiai — investicijų vertė išliks stabili", source:"medium"},
  {q:"Pirkimas išsimokėtinai — patogus sprendimas, leidžiantis įsigyti daiktą dabar ir visą pinigų sumą mokėti per nustatytą laikotarpį. Tačiau ir šis sprendimas reikalauja atidumo ir svarstymų. Atsakyk, į ką svarbu atkreipti dėmesį?", a:"Gali tekti iš naujo planuoti ateities biudžetą", source:"medium"},
  {q:"Ar žinai, kokiais biudžeto valdymo įrankiais gali naudotis, kad sustiprintum savo finansinę sveikatą?", a:"Visi atsakymai teisingi", source:"medium"},
  {q:"Perkant daiktą žinome, kad jo kaina nebūtinai nusako vertę. O kaip yra investavime?", a:"Ne", source:"medium"},
  {q:"Su kokiais iššūkiais galima susidurti ir ką reikėtų apsvarstyti, norint pasiimti greitąjį kreditą ar vartojimo paskolą?", a:"Visi atsakymai teisingi", source:"medium"},
  {q:"Kam reikalingas biudžetas?", a:"Biudžetas padeda planuoti ir priimti apgalvotus sprendimus, kur leisti savo pinigus", source:"medium"},
  {q:"Pradėti pamažu Nebūtina investuoti didelėmis sumomis — pradėti galima vos nuo 1 Eur! Kokią pradinę sumą į akcijas rekomenduoja investuoti Tautvydas Marčiulaitis?", a:"Nedidelę sumą, kuri neturėtų įtakos bendram biudžetui", source:"medium"},
  {q:"Ta pati kaina Daiktų vertė nuolat keičiasi — o kaip yra su investavimu? Ar investavuojant į investicinį fondą, fondo vienetai bus nupirkti už kainą, kuri matoma sandorio sudarymo metu?", a:"Ne, investuojat į investicinius fondus- fondo vieneto kaina yra nežinoma", source:"medium"},
  {q:"Atsakyk, kokioje šalyje buvo išrasta apskaitos sistema?", a:"Italijoje", source:"medium"},
  {q:"Kas gi yra tas biudžetas?", a:"Tai finansų planas, kuomet įvertinę visas savo pajamas ir išlaidas, paskirstome jas į tam tikras kategorijas", source:"medium"},
  {q:"Nedarbo rekordas! Ar esi girdėjęs posakį — kas nedirba, mielas vaike, tam ir duonos duot nereikia? Kinijoje sparčiai auga jaunimo nedarbo lygis — 2023 m. gegužę jis pasiekė rekordą! Atsakyk, kiek procentų jis viršijo?", a:"20 %", source:"medium"},
  {q:"Knygos neišmoko visko, bet gali laaaaaaabai padėti. Tarkim, kaip valdyti savo išlaidas. Paskaityk ir atsakyk, kiek patarimų turi Jūratė, norintiems susekti, kur iškeliauja jų pinigai. Atsakyti padės „Pradėk dabar: finansinis gidas paaugliams“.", a:"6", source:"medium"},
  {q:"Kokiais atvejais tavo finansinė sveikata yra stipri?", a:"Visi atsakymai teisingi", source:"medium"},
  {q:"Ką daryti, jei kyla sunkumų išsikeliant taupymo tikslus bei kuriant planą, kaip jų pasiekti?", a:"Stiprinti finansinę sveikatą ir raštingumą", source:"medium"},
  {q:"Ar tikrai to užtenka? Verslas turi labai kokybišką produktą? Vadinasi, juo rūpintis nebereikia. Bet ar tikrai? Ar turint gerai parduodamą prekę reikėtų pasikliauti jos populiarumu ir visus resursus nukreipti kitoms verslo sritims vystyti?", a:"Ne, konkurencija rinkoje nuolat auga, tad reikia ir toliau vystyti sėkmingą prekę ir rūpintis jos reklama", source:"medium"},
  {q:"Nepaslysk Gera pradžia — pusė darbo. Tad kaip nepaslysti pirmuose investavimo žingsniuose? Atsakyk, su kuo kiekvienam investuotojui svarbu susipažinti prieš pradedant investuoti į investicinius fondus per Swedbank?", a:"“Pagrindine informacija investuotojui”", source:"medium"},
  {q:"Periodinis investavimas Ar žinojai, kad įpročiams susiformuoti reikia maždaug mėnesio? Norint investuoti periodiškai, patariama tai daryti kartą per mėnesį. Atsakyk, į ką svarbu atkreipti dėmesį, jei investuojama dažniau?", a:"Į komisinius mokesčius", source:"medium"},
  {q:"Pinigų funkcijos Pinigų norime visi, bet ar tikrai suvokiame visas jų funkcijas? Kokios yra pinigų funkcijos?", a:"Visi atsakymai teisingi", source:"medium"},
  {q:"Norim čia ir dabar! Tomas ir Živilė — jauna šeima, panorusi automobilį įsigyti lizingu. Atsakyk, ką jie turėtų žinoti, kad ilgainiui nenukentėtų šeimos finansai! Kiek proc. pajamų per mėnesį neturėtų viršyti įmoka automobiliui įsigyti?", a:"10–15 % šeimos pajamų", source:"medium"},
  {q:"Kokią dalį pelno rekomenduojama atidėti santaupoms?", a:"10 %", source:"medium"},
  {q:"Pagalvok ir atsakyk, ar tai yra geras požiūris?", a:"Taip, tai reiškia, kad investuotojas pasirinko teisingą sumą investavimui. Investicijų vertės svyravimai jam nekelia problemų", source:"medium"},
  {q:"Atsakyk, kas yra nuomos grąža?", a:"Rodiklis, parodantis, kokią dalį būsto kainos nuomininkas sumoka per metus", source:"medium"},
  {q:"Kokia yra viena pagrindinių investavimo taisyklių?", a:"Investuoti pagal išsikeltus tikslus ir planą", source:"medium"},
  {q:"Jei reikėtų tik savo nuojautos dėka priimti sprendimus, kaip atrodytų tavo pasaulis?", a:"Ne, siekiant ilgalaikės verslo sėkmės jį reikia planuoti ir vykdyti pagal planą", source:"medium"},
  {q:"Apsaugininkas Geras bankas ne tik turi daug gerų paslaugų, bet ir yra geras finansų patarėjas! Bankas rekomenduoja užpildyti tinkamumo klausimyną. Atsakyk, kam jis reikalingas?", a:"Bankas įvertins klausimyno atsakymus ir pateiks klientui investavimo rekomendaciją", source:"medium"},
  {q:"Ar spekuliacijoms akcijų biržoje rekomenduojama skirti visas investavimui skirtas lėšas?", a:"Ne, paprastai rekomenduojama skirti mažą investicijų portfelio dalį", source:"medium"},
  {q:"Kas, pasak Jūratės Cvilikienės, yra sveiko verslo pagrindas?", a:"Žinios, veiksmas ir imunitetas", source:"medium"},
  {q:"Koks investavimo laikotarpis paprastai rekomenduojamas investuojant į akcijas ar akcijų fondus?", a:"Daugiau kaip 5 metai", source:"medium"},
  {q:"Norint pagerinti savo finansinę sveikatą, pirmiausia reikia susikurti biudžetą. Atsakyk, nuo ko reikia pradėti dėliojant asmeninį biudžetą?", a:"Nuo pajamų ir išlaidų įvertinimo", source:"medium"},
  {q:"Pagalvok ir atsakyk, ką svarbu žinoti perkant naują automobilį iš salono?", a:"Nauji automobiliai praranda dalį savo vertės tik išvažiavę iš salono", source:"medium"},
  {q:"Ar spėsim pasenti, kol užaugs investicijos? Juk tam reikia tieeek daug laiko!", a:"Visi išvardinti", source:"medium"},
  {q:"Tiesa ar melas: palūkanų normų fiksavimas reiškia, kad bet kuriuo momentu galima pasirinkti tuo metu galiojančio EURIBOR fiksavimą.", a:"Melas", source:"medium"},
  {q:"Planuojant ir skirstant savo biudžetą galime lengviau pasiekti finansinių tikslų. Kaip iš eilės rekomenduojama skirstyti tris finansų grupes: būtinąsias išlaidas, kintamąsias išlaidas ir kiek atsidėti taupymui?", a:"50 %–30 %–20 %", source:"medium"},
  {q:"Atsakyk, kaip vadinamas veiksmas, kai investuojant siekiama greitai praturtėti?", a:"Spekuliavimas", source:"medium"},
  {q:"Ar žinojai, kad delfinai laikomi protingiausiais gyvūnais Žemėje? Įsivaizduok, jei jie investuotų!", a:"Kai investuojama 10 proc. gaunamų pajamų", source:"medium"},
  {q:"Freelancerio veiklą gali vykdyti pagal individualios veiklos pažymą arba verslo liudijimą. Pagalvok ir atsakyk, kokie, be mokesčių, yra pagrindiniai šių būdų skirtumai?", a:"Individualią veiklą pagal pažymą patartina rinktis tada, kai iš veiklos yra gaunamos nuolatinės pajamas\nVerslo liudijimų veiklų sąrašas daug mažesnis", source:"medium"},
  {q:"Kas tau padeda susitvarkyti su stresu? Joga, sportas, o gal ramus pasivaikščiojimas parke?", a:"Ne, finansinę įtampą gali jausti ir pasiturintys žmonės, kuriems sunku valdyti savo finansus", source:"medium"},
  {q:"Turi pinigų ir nežinai ką su jais daryti? Gali ilgai nieko ir nedaryti — tiesiog pasinaudoti indėliu ir gauti palūkanas!", a:"Terminuotieji ir neterminuotieji indėliai", source:"medium"},
  {q:"„Swedbank“ Kliento finansinės sveikatos indeksas (rodiklis) yra nustatomas pagal du dalykus. Kokius?", a:"Finansines žinias ir finansinius gebėjimus", source:"medium"},
  {q:"Santaupas netikėtoms išlaidoms ateityje mes vadiname finansine saugumo pagalve. Atsakyk, kokio dydžio ta pagalvė turi būti, kad patyrus netikėtas išlaidas ateityje tu galėtumei jaustis saugiau finansiškai?", a:"3–6 mėn. pajamų dydžio", source:"medium"},
  {q:"Saugumo pagalvė Tam, kad netikėtose situacijose jaustumeisi finansiškai saugus, rekomenduojama turėti sukaupus 3–6 mėn. išlaidų dydžio finansinį rezervą. O ar jo reikia verslui? Reikia! Atsakyk, kokio dydžio finansinį rezervą reikia turėti verslui?", a:"6 mėn. įmonės išlaidų", source:"medium"},
  {q:"Atleidimo reikalai Kai darbuotojas yra atleidžiamas iš darbo, jam priklauso išeitinė išmoka. Tačiau ar ji priklauso visais atleidimo atvejais? Ar darbuotojui, atleistam bandomojo laikotarpio metu, yra mokama išeitinė išmoka?", a:"Ne", source:"medium"},
  {q:"Kodėl atsidarant vertybinių popierių sąskaitą yra klausiama apie investuotojo šeimyninę padėtį?", a:"Jei investuotojas yra santuokoje, jis turi pateikti sutuoktinio įgaliojimą, kuris yra reikalingas parduodant vertybinius popierius", source:"medium"},
  {q:"Kas, pasak žymaus Amerikos verslininko Warren’o Buffet’o, yra aštuntasis pasaulio stebuklas?", a:"Sudėtinės palūkanos", source:"medium"},
  {q:"Perku ir parduodu Turiu akcijų, tai investuoju — perku jas arba parduodu! Kaip vadinamas nurodymas pirkti arba parduoti akcijas už geriausią prieinamą kainą?", a:"Rinkos pavedimas", source:"medium"},
  {q:"Specialus pavadinimas Ar pameni pirmąjį iš santaupų nusipirktą daiktą? O gal esi kažką pardavęs? Startuoliai savo pirmiesiems atliktiems pardavimams turi specialų pavadinimą! Atsakyk, kokį?", a:"MVP pardavimas", source:"medium"},
  {q:"Galvodama apie tai, Beata Nicholson prisimena frazę: „Prisijaukinai lapę, tai dabar esi už ją atsakingas“. Iš kokio klasikinio kūrinio Beata prisiminė šią mintį?", a:"„Mažasis princas“", source:"medium"},
  {q:"Kur žygiuoti? Gal investuoti ten, o gal šen? Pradžioje visi investavimo takai gali atrodyti sudėtingi. Sužinok, kur žygiuoti pradedantiesiems!", a:"Investuoti į akcijų ir obligacijų fondus", source:"medium"},
  {q:"Taip, tai išlaidos! Savo išlaidas galima suskirstyti į tris dalis: pasirenkamas, privalomas ir būtinas. Atsakyk, kurias iš jų reikia padengti pirmiausia?", a:"Privalomas", source:"medium"},
  {q:"Į ką svarbiausia atkreipti dėmesį renkantis finansinį investavimo tarpininką?", a:"Ar tarpininkas yra licenzijuotas", source:"medium"},
  {q:"Atsakyk, ar tiesa, kad investuoti į vienos įmonės akcijas yra saugiau nei investuoti į fondus?", a:"Netiesa", source:"medium"},
  {q:"Atsakyk, kaip geriausia pasirinkti į ką investuoti?", a:"Investuoti į įmones, kurios mus domina, kurias mes suprantame ir sekant jų progresą vystyti savo investavimo patirtį", source:"medium"},
  {q:"Pagalvok ir atsakyk, kas kylant palūkanų normoms paprastai atsitinka su obligacijų kainomis?", a:"Jos nukrenta", source:"medium"},
  {q:"Įsivaizduok, kad Justinos taupomosios sąskaitos metinė palūkanų norma buvo 1 proc., o metinė infliacija — 2 proc. Kiek po 1 metų Justina galėtų nusipirkti už šioje sąskaitoje esančius pinigus?", a:"Mažiau nei šiandien", source:"medium"},
  {q:"Įsivertiname! Kaip pagerinti finansinę sveikatą? Pradėti nuo jos įvertinimo — tam, kad žinotumei, kaip ją patobulinti! Atsakyk, koks, pagal 2023 m. vasario mėn. tyrimą, yra Lietuvos gyventojų finansinės sveikatos (balais) įvertinimas?", a:"51 iš 100", source:"medium"},
  {q:"Kokios rizikos yra išskiriamos investuojant į nekilnojamąjį turtą, pavyzdžiui, butą nuomai? Pažymėk jas visas.", a:"Turto nusidėvėjimas\nMaža diversifikacija\nNemokūs nuomininkai\nAukšta pradinių investicijų riba", source:"medium"},
  {q:"Nes močiutė gauna pensiją! Pensijos išmokos dydis yra individualus ir priklauso nuo tam tikrų kriterijų. Atsakyk, kokių?", a:"Visi atsakymai teisingi", source:"medium"},
  {q:"Gerai pagalvok ir atsakyk: ar tiesa, kad būsto paskola, kurią reikės grąžinti per 15 metų, turės didesnes mėnesines įmokas nei ta, kurią reikės grąžinti per 30 metų?", a:"Tiesa", source:"medium"},
  {q:"Susipažink „Tai yra neribotos atsakomybės privatusis juridinis asmuo, už neįvykdytas įmonės prievoles savininkas atsako savo turtu. Steigėju ir savininku gali būti tik vienas fizinis asmuo, kuris negali būti kitos įmonės savininku.“ Kokią įmonės veiklos formą apibūdina ši citata?", a:"Individualią įmonę", source:"medium"},
  {q:"Prognozės Prognozuoti galime orą, krepšinio rungtynių baigtį ar „Eurovizijos“ konkurso laimėtoją. Prognozuoti galime ir investicijas! Atsakyk, ką vadiname rinkos lūkesčiu?", a:"Analitikų atlikto tyrimo rezultatus, prognozuojančius įmonės uždarbį per ateinantį laikotarpį", source:"medium"},
  {q:"Žinios žinelės Rinkos pavedimą jau žinai — pažink dar vieną akcijų pirkimo arba pardavimo nurodymą! Kaip vadinamas nurodymas pirkti arba parduoti akcijas už konkrečią ar geresnę kainą?", a:"Ribinis pavedimas", source:"medium"},
  {q:"Ar esi pasiruošęs išspręsti šį iššūkį? Tavęs laukia galvosūkis!Justina taupomojoje sąskaitoje turėjo 100 Eur, o metinė palūkanų norma buvo 2 proc. Kaip manai, kokią sumą savo sąskaitoje Justina turės po 5 metų, jei joje paliks pinigus?", a:"Daugiau nei 102 Eur", source:"medium"},
  {q:"Nuo ko priklauso vertybinių popierių sąskaitos atsidarymo ir investavimo įkainiai?", a:"Investavimo įkainiai priklauso nuo pasirinkto finansų tarpininko", source:"medium"},
  {q:"Ekspertai sako, kad investavimas nuolat, kad ir nedidelėmis sumomis, yra tvarus būdas siekti savo finansinių tikslų. Žinodamas tai, atsakyk, kas yra periodinis investavimas?", a:"Investavimo strategija, kai investuotojas reguliariai investuoja fiksuotą pinigų sumą, neatsižvelgdamas į akcijų rinkos rezultatus", source:"medium"},
  {q:"Dar nėra tokių svarstyklių, kurios galėtų pasverti sprendimus. O kas būtų, jeigu būtų?", a:"Investavimo Riziką", source:"medium"},
  {q:"Todėl pradėti investuoti — tikrai verta! Atsakyk, kada vertėtų pradėti investuoti?", a:"Nuo pirmojo atlyginimo", source:"medium"},
  {q:"Atsakyk, kurios pensių pakopos įmokas sudaro dvi dalys: įmoka nuo atlyginimo ir skatinamoji įmoka iš valstybės biudžeto?", a:"II", source:"medium"},
  {q:"1…2…3… Pirmyn! Atsakyk, kas startuolių pasaulyje reiškia „pivot“?", a:"Startuolio verslo modelio ar strategijos pakeitimas, siekiant prisitaikyti prie rinkos sąlygų", source:"medium"},
  {q:"Įvairi metodika Kaip geriausia auginti savo verslą? Ką daryti ir ko ne? Metodų, kaip vystyti savo verslą yra išties daug — pažink vieną iš jų!", a:"Iteracinis metodas, orientuotas į greitą prielaidų išbandymą ir patvirtinimą, siekiant sukurti perspektyvų verslą", source:"medium"},
  {q:"Rišame batus? Išvertus šį žodžių junginį pažodžiui tai reikštų bato surišimą. Bet čia visai ne apie tai! Pagalvok ir atsakyk, kas yra „bootstrapping“ startuolių pasaulyje?", a:"Bendrovės kūrimas ir auginimas turint ribotus išorinius išteklius ar kapitalą", source:"medium"},
  {q:"Ar pastebėjai, kad startuolių pasaulyje įvairūs mums žinomi žodžiai reiškia visai kitokius dalykus? Ir jų dar yra!", a:"Siūlyti startuoliams bendradarbystės erdves ir bendrus išteklius", source:"medium"},
  {q:"Atsakyk, kurioje pensijų pakopoje yra gaunama tik valstybinio socialinio draudimo fondo (Sodros) pensija?", a:"I", source:"medium"},
  {q:"Tvarumas ir taupymas — abi sąvokos skamba šauniai. O kaip manai, ar jos susiję?", a:"Taip, nes taupymas yra finansinio tvarumo pagrindas — žmonės, turintys santaupų, yra atsparesni piniginiams iššūkiams", source:"medium"},
  {q:"Lietuviškai šią sąvoką dar vadiname kitu burtažodžiu — MPP (minimaliu perspektyviu produktu). Atsakyk, koks yra šio produkto tikslas?", a:"Pritraukti pirmuosius klientus ir surinkti grįžtamąjį ryšį tolesniam vystymui", source:"medium"},
  {q:"Rūpesčio reikia visiems — taip, net ir tavo finansai nori jaustis saugiai! Tad kaip jais pasirūpinti?", a:"Visi atsakymai teisingi", source:"medium"},
  {q:"Rytis įsidarbino ir jau gavo 2 atlyginimus, liko 1 mėnuo iki bandomojo laikotarpio pabaigos. Atsakyk, ar šio laikotarpio metu Rytis gali gauti paskolą?", a:"Ne", source:"medium"},
  {q:"Investavimo ABC Investavimas yra susijęs su rizika, todėl investuodamas turi pagalvoti apie būdus, kaip tą riziką mažinti. Vienas iš jų yra apibrėžiamas specialia investavimo sąvoka! Užbaik sakinį: investicijų paskirstymas kelioms turto klasėms, sektoriams ir geografiniams regionams, siekiant sumažinti bendrą portfelio riziką yra vadinamas…", a:"Diversifikacija", source:"medium"},
  {q:"Pagalvok ir atsakyk, kokia yra pagrindinė gyvybės draudimo paskirtis?", a:"Užtikrinti šeimos finansinį saugumą apdraustajam susirgus, tapus neįgaliam ar mirus", source:"medium"},
  {q:"Ką reikia apgalvoti renkantis rizikas, nuo kurių norėtumei būti apdraustas?", a:"Kuo daugiau pasirinksi rizikų, tuo didesnė įmokos dalis bus skiriama šioms rizikoms padengti ir dėl to mažiau bus skiriama kaupimui", source:"medium"},
  {q:"Vienas gudriausių dalykų, kuriuos gali nuveikti su iš investicijų uždirbtais pinigais, — tai juos reinvestuoti. Ar žinai, kas yra reinvestavimas?Investavimas po petraukos", a:"Iš investicijų gauto pelno pakartotinis investavimas", source:"medium"},
  {q:"Kokiomis kalbomis yra užrašai?", a:"Lotynų\nGraikų\nKirilica", source:"medium"},
  {q:"Kuo skiriasi pirmoji ir antroji euro banknotų serijos? Pažymėk teisingus atsakymus.", a:"Pirmojoje banknotų serijoje buvo leidžiami 500 eur. vertės banknotai\nAntrosios serijos eurų banknotai yra patvaresni negu pirmosios serijos banknotai\nAntroji eurų banknotų serija geriau apsaugota nuo padirbinėjimo", source:"medium"},
  {q:"Atsakyk, kas yra vienaragis startuolių pasaulyje?", a:"Startuolis, kurio vertė viršija 1 mlrd. dolerių", source:"medium"},
  {q:"Sėkmės formulė Ar jau žinai, kaip sukurti „TikTok“ video, kuris pasiektų milijonus žiūrovų? Beatos Nicholson tinklaraštis jau ilgą laiką yra populiariausias maisto tinklaraštis Lietuvoje. Kokia, pasak Beatos, yra to sėkmės formulė?", a:"Reikia būti savimi ir daryti tai, kas tau patinka", source:"medium"},
  {q:"Kiekybė ar kokybė? Parduotuvėje renkiesi pigesnį, bet mažiau skanų šokoladuką, ar brangesnį, bet patį mėgstamiausią? Koks kriterijus, pasak verslininkės Karolinos, labiausiai lemia prekių populiarumą ir sėkmingus pardavimus?", a:"Kokybė", source:"medium"},
  {q:"Atsakyk, kas paprastai nėra startuolių finansavimo šaltinis?", a:"Banko paskolos", source:"medium"},
  {q:"Informacija apie tave Nori pasirūpinti gyvybės draudimu? Tau reikės pateikti šiek tiek informacijos! Sudarant gyvybės draudimo sutartį, draudikui reikia pateikti asmeninę informaciją: amžių, sveikatos būklę, profesiją ir pan. Kaip manai, kodėl?", a:"Tam, kad draudikas galėtų įvertinti riziką", source:"medium"},
  {q:"Jei skaičiuotume pinigine išraiška, kokią ribą tiesioginiai nuostoliai perkopė 2017 metais?", a:"300 mlrd. Eur", source:"medium"},
  {q:"Verslo pasaulyje pilna angliškų sąvokų — ar tau pavyks rasti lietuvišką jų paaiškinimą?", a:"Prezentacija, kurią verslininkai naudoja tam, kad potencialiems investuotojams pristatytų savo verslo idėjas", source:"medium"},
  {q:"Ką darytum, jei eidamas gatve praeitum dramblį ar pamatytum koalą? Žnybtum sau į ranką tikrindamas, ar nesapnuoji?", a:"Papūga", source:"medium"},
  {q:"Verslo angelai vaikšto žemėje ir ištiesia pagalbos ranką pradedantiesiems verslininkams. Atsakyk, kurie iš šių teiginių apie verslo angelus yra teisingi?", a:"Verslo angelai paprastai yra stambūs instituciniai investuotojai\nVerslo angelai teikia finansavimą mainais į startuolių akcijų nuosavybę", source:"medium"},
  {q:"Kiek skirtingų būdų yra norint registruoti savo veiklą ir mokėti mokesčių dalį nuo gaunamų pajamų?", a:"Šeši", source:"medium"},
  {q:"Įvaizduok, kad investuoji tuo metu, kai pasaulyje siaučia ekonominis sunkmetis. Ką daryti — investuoti į vertės ar augimo akcijas?", a:"Didesnė nei investuojant į vertės akcijas", source:"medium"},
  {q:"Netrukus dėl šylančio klimato vilkai sukvies savo giminaičius ir Lietuvoje surengs fiestą. Manai, kad juokaujam? Įsitikink pats!", a:"Šakalų", source:"medium"},
  {q:"Kaip vadinasi paveikslėlyje pavaizduota euro banknoto dalis ?", a:"Aversas", source:"medium"},
  {q:"Nors iš aukso dažniausiai gaminame papuošalus, jis taip pat yra ir vienas iš investavimo objektų. Ar žinai, kaip jis susijęs su pinigų verte?", a:"Brangsta", source:"medium"},
  {q:"Akceleratorius Išgirdęs žodį „akceleratorius“ iškart pagalvoji apie greitą automobilį? Galvok iš naujo! Su akceleratoriaus sąvoka gali susidurti ir startuolių pasaulyje. Pagalvok ir atsakyk, kas yra akceleratoriaus programa?", a:"Programa, kuri startuoliams siūlo mentorystę, išteklius ir bendravimo galimybes", source:"medium"},
  {q:"Daugelis lietuvių dėl klimato kaitos padarinių jaučiasi saugiai. Vis dėlto, Lietuva skaičiuoja klimato kaitos padarytus nuostolius. Kokius piniginius nuostolius Lietuva patyrė nuo 1980 metų?", a:"Beveik 1 mlrd.", source:"medium"},
  {q:"Pinigai ant medžių neauga. Bet jie gali augti investavimo dėka!Išmokus taupyti ir sukaupus 3–6 mėnesių išlaidų dydžio finansinę pagalvę bei turint atliekamų pinigų, kitas logiškas žingsnis — išmokti investuoti. Atsakyk, nuo kokios sumos galima pradėti investuoti į fondus?", a:"Galima pradėti investuoti vos nuo 1 Eur", source:"medium"},
  {q:"Pagalvok ir atsakyk, kas yra finansinė sveikata?", a:"Gebėjimas tinkamai pasirūpinti savo kasdieniais finansiniais poreikiais\nRūpinimasis savo ateitimi, stengiantis numatyti galimas išlaidas\nŽinios, kaip galima išvengti prastų finansinių sprendimų, įskaitant mokėjimą apsisaugoti nuo sukčių", source:"medium"},
  {q:"Lengvai ir greitai Finansų pasaulyje visai kaip ir kasdienybėje — jei kažko nežinai, gali pagooglinti,pasidomėti ir atsirinkti informaciją. Tad metam tau iššūkį — ar pavyks šįkart klausimą įveikti su „Google“ pagalba? 1, 2, 3…„Google“! Kas yra S&P 500 ir Dow Jones Industrial Average?", a:"Akcijų grupės veiklos rodiklis, dar vadinamas akcijų indeksu", source:"medium"},
  {q:"Kokia dalis visų pasaulio įmonių susiduria su padidėjusia veiklos rizika dėl klimato kaitos?", a:"Trečdalis", source:"medium"},
  {q:"Kiekvienas vairuotojas dar iki teisių gavimo pasvajoja, koks bus pirmasis automobilis. Tiesa, mažai, kas galvoja apie jo kainą. Ekspertai sako, kad verčiau pirkti brangesnę, bet patikimesnę transporto priemonę. Bet iš kur gauti tokią sumą?", a:"Automobilio lizingas", source:"medium"},
  {q:"Finansinis nerimas — tai nuolatinis nerimas, baimė ar neužtikrintumas dėl pinigų. Pagrindinis jo požymis — XXX. Kas yra XXX?", a:"Vengimas", source:"medium"},
  {q:"Pakeliaukime laiku Vystantis žmonijai, vystėsi ir būdai atsiskaityti už prekes ir paslaugas. Pasirink, kuri pinigų atsiradimo istorijos įvykių seka yra chronologiškai teisinga.", a:"Mainai, tauriųjų metalų monetos, popieriniai pinigai, skaitmeniniai pinigai.", source:"medium"},
  {q:"Iš kur mokslininkai ima mėginius praeities CO2 koncentracijai nustatyti?", a:"Iš ledo", source:"medium"},
  {q:"Apie valiutas Pasaulyje egzistuoja šimtai valiutų su pačiais keisčiausiais pavadinimais. Tačiau vienos Afrikos valstybės valiuta pasižymi bene „skausmingiausiu“ pavadinimu. Kaip vadinasi oficiali Pietų Afrikos Respublikos valiuta?", a:"Randas", source:"medium"},
  {q:"Kada keisti? Įsivaizduok situaciją: Laura grįžta iš kelionės po JAV ir prisimena, jog piniginėje liko penkiasdešimties dolerių kupiūra. Ji nori ją išsikeisti į eurus. Kada Laurai tai padaryti būtų nepalanku?", a:"Pakilus euro kursui dolerio atžvilgiu", source:"medium"},
  {q:"Koks architektūrinis stilius vaizduojamas 20 eurų vertės banknotuose?Baroko ir rokoko Renesanso Klasikinis Gotikos Romaninis", a:"Gotikos", source:"medium"},
  {q:"Paskolos kainos Bankai tau gali pateikti skirtingus pasiūlymus paskolai gauti. Kaip žinoti, kuris yra naudingiausias tau? Įsivaizduok, kad kreipiesi į bankus dėl vartojimo paskolos. Koks rodiklis tau gali parodyti, kuri vartojimo paskola yra pigiausia?", a:"Bendra vartojimo kredito kainos metinė norma", source:"medium"},
  {q:"Kalėdų senelis ir bankas Sunku patikėti, tačiau mūsų visų mylimas žilabarzdis Kalėdų senelis kadaise turėjo savo banką ir net banknotus! Kiek laiko gyvavo Kalėdų senelio bankas? Nespėliok, skaityk ir atsakyk.", a:"40 m", source:"medium"},
  {q:"O ar žinai, kiek laiko saugomi tavo asmeninės kredito istorijos įrašai?", a:"Dešimt metų", source:"medium"},
  {q:"Kinijoje taupant elektros energiją buvo uždaromi prekybos centrai ir gamyklos. Atsakyk, kokie veiksniai tai lėmė!", a:"Dėl išsekusių upių sulėtėjęs hidroelektrinių darbas", source:"medium"},
  {q:"Įsivaizduok, kad draugui paskolinai pinigų. Kiek laiko lauksi grąžinimo? Bankas laukia ne vienus metus!", a:"30 metų", source:"medium"},
  {q:"Kaip manai, kas, turint automobilį, kainuoja daugiausiai?", a:"Remontas ir priežiūra", source:"medium"},
  {q:"O kas savininkas? Noriu įsigyti automobilį lizingu — ar tapsiu jo savininku? Atsakyk, kieno vardu VĮ „Regitroje“ bus registruojamas lizinguojamas automobilis?", a:"Lizingo bendrovė bus registruojama kaip savininkas, o pirkėjas — valdytojas.", source:"medium"},
  {q:"Chaosas Vokietijoje Klimato kaitos keliami nuostoliai neapsiriboja tam tikra teritorija ir plinta visame pasaulyje — ne išimtis ir Vokietija. Dėl klimato kaitos kaltės sutriko prekių ir žaliavų tiekimas Vokietijoje. Koks klimato kaitos požymis lėmė šį sutrikimą?", a:"Nusekusios upės", source:"medium"},
  {q:"Kodėl toks susižavėjimas gali būti žalingas?", a:"Visi variantai teisingi", source:"medium"},
  {q:"Kaip vadiname nelauktus, didelę reikšmę rinkoms turinčius įvykius, kuriuos labai sunku nuspėti?", a:"„Juodosios gulbės“", source:"medium"},
  {q:"Ar tiesa, kad banko paskolos sąlygoms įtaką gali daryti praeityje buvę vėlavimai apmokėti sąskaitas, finansinių įsipareigojimų nevykdymas ir greitieji kreditai?", a:"Tiesa", source:"medium"},
  {q:"Jei bandomojo laikotarpio metu kreiptis dėl būsto paskolos negalima, tai kada jau metas? Atsakyk, po kiek laiko nuo įsidarbinimo (darbo pakeitimo) galima kreiptis dėl būsto paskolos?", a:"Ne mažiau kaip po 6 mėn.", source:"medium"},

  {q:"JAV buvo atliktas tyrimas, susijęs su darbu ir laime. Atsakyk, kokios profesijos atstovai, anot tyrimo, dirbdami savo darbą jaučiasi laimingiausi?", a:"Neurochirurgai", source:"medium"},
  {q:"Pagal „Swedbank“ užsakymu atliktą apklausą net 50 proc. lietuvių investavimo spendimus priima…Kaip?", a:"Remdamiesi savo patirtimi", source:"medium"},

  {q:"Dabar sukaupus 31 metų stažą žmogus gali gauti viso dydžio pensiją. Tačiau nuo 2027 metų, siekiant gauti viso dydžio senatvės pensiją, asmuo turės būti sukaupęs ____ darbo stažą. Pažymėk praleistą frazę!", a:"35 metų", source:"medium"},

  {q:"Ar žinojai, kad norint sudaryti vieną bitkoinų sandorį, reikia sunaudoti tiek pat energijos, kiek tai padaro vidutinis Lietuvos namų ūkis per metus?", a:"Apie 1200 kilovatvalandžių", source:"medium"},
  {q:"Atsakyk, kaip vadinama investicijų rūšis, kurią valdo profesionalai ir kaupia kelių investuotojų pinigus, kad įsigytų diversifikuotą įvairių vertybinių popierių portfelį?", a:"Investiciniai fondai", source:"medium"},
  {q:"Kiek reikės sutaupyti? Svajoji turėti savo būstą? Sužinok, kiek turėsi sutaupyti! Jei norėtum gauti paskolą iš banko, tau vis tiek reikėtų įnešti savo santaupų. Atsakyk, kokį minimalų pradinį įnašą (procentais), prieš skolinantis būsto įsigijimui, tau reikėtų sukaupti?", a:"Bent 15 proc., skaičiuojant nuo įsigyjamo turto kainos ar vertės", source:"medium"},
  {q:"Akcijos, obligacijos, palūkanos… Skamba kaip nepažįstamos vietovės? Ištirkim jas kartu!", a:"Krenta", source:"medium"},
